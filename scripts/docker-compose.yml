version: '3.6'

services:
  bandone:
    image: nginx
    restart: always
    volumes:
      - "./:/usr/share/nginx/html"
    environment:
      # NGINX-PROXY ENVIRONMENT VARIABLES: UPDATE ME
      - VIRTUAL_HOST=band-one.example, band-one.example
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=band-one.example, band-one.example
      - LETSENCRYPT_EMAIL=salomandthelaundrybear@gmail.com
      # /END NGINX-PROXY ENVIRONMENT VARIABLES
    expose:
      - 80

networks:
  default:
    external:
      name: nginx-proxy
