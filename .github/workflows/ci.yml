name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  # The API suite and the browser smoke test against a throwaway Postgres: the
  # schema applied twice (it must stay idempotent), a seeded Pro band, and the
  # app served by tests/harness/server.js. Needs no secrets, so it also runs
  # on forks.
  local-integration:
    name: Integration + browser tests (local Postgres)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartist
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/smartist
      APP_SECRET: ci-only-secret
      ARTIST_SLUG: ci
      ARTIST_EMAIL: ci@example.test
      ARTIST_PASSWORD: ci-only-password
      # Presigning is local signing, no request to R2 — any values will do.
      R2_ACCOUNT_ID: ci
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_BUCKET_NAME: ci
      R2_PUBLIC_URL: https://cdn.example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Apply the schema twice, then check it is current
        run: |
          node scripts/apply_schema.js --yes
          node scripts/apply_schema.js --yes
          node scripts/apply_schema.js --check
      - name: Seed the test band
        run: node tests/harness/seed.js
      - name: Start the API
        run: |
          node tests/harness/server.js > server.log 2>&1 &
          for i in $(seq 30); do
            curl -sf http://localhost:3000/api/config?action=health > /dev/null && exit 0
            sleep 1
          done
          cat server.log; exit 1
      - name: Run the API suite
        run: cd tests && node api.js
      # Not a dependency: the playwright package downloads browsers on install,
      # which the Vercel deployments must not do.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke test (sign in, every page, SPA nav, stage)
        run: node tests/smoke.js
      - name: Server log
        if: failure()
        run: cat server.log

  # Deployments migrate their database in the build (scripts/deploy_migrate.js),
  # a minute or two before the new code goes live. For that window the code on
  # main runs against the new schema: this runs main's own API suite on it. A
  # column dropped while main still reads it, or a NOT NULL column main does
  # not fill, fails here. Skipped when schema.sql matches main.
  live-code-new-schema:
    name: Live code on the new schema
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartist
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/smartist
      APP_SECRET: ci-only-secret
      ARTIST_SLUG: ci
      ARTIST_EMAIL: ci@example.test
      ARTIST_PASSWORD: ci-only-password
      R2_ACCOUNT_ID: ci
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_BUCKET_NAME: ci
      R2_PUBLIC_URL: https://cdn.example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Did the schema change?
        id: diff
        run: |
          if git diff --quiet origin/main -- scripts/schema.sql; then
            echo "schema.sql matches main: nothing to check."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        name: New schema, main's code
        run: |
          npm ci
          node scripts/apply_schema.js --yes
          git worktree add live origin/main
          cd live && npm ci
      - if: steps.diff.outputs.changed == 'true'
        name: Seed and start main's API
        working-directory: live
        run: |
          node tests/harness/seed.js
          node tests/harness/server.js > server.log 2>&1 &
          for i in $(seq 30); do
            curl -sf http://localhost:3000/api/config?action=health > /dev/null && exit 0
            sleep 1
          done
          cat server.log; exit 1
      - if: steps.diff.outputs.changed == 'true'
        name: Main's API suite
        working-directory: live/tests
        run: node api.js
      - name: Server log
        if: failure() && steps.diff.outputs.changed == 'true'
        run: cat live/server.log

  integration-tests:
    name: Integration tests (Vercel preview)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Secrets are unavailable to pull requests from forks and cannot be read in
    # a job-level `if`, so the job runs everywhere and the steps skip themselves
    # when VERCEL_TOKEN or the protection-bypass secret is absent.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Preview deployments sit behind Vercel Deployment Protection; the suite
      # needs the project's "Protection Bypass for Automation" secret to reach them.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Check for Vercel credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN — skipping integration tests."
          elif [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::warning::Integration tests skipped: add the Vercel 'Protection Bypass for Automation' secret as VERCEL_AUTOMATION_BYPASS_SECRET (previews are protected, every request would get Vercel's 401)."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # tests/ has no dependencies of its own; it resolves from the root install.
      - name: Install Vercel CLI and dependencies
        if: steps.creds.outputs.ok == 'true'
        run: |
          npm install -g vercel@59.26.0
          npm ci

      - name: Deploy preview
        id: deploy
        if: steps.creds.outputs.ok == 'true'
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" > /dev/null
          DEPLOY_URL=$(vercel deploy --token="$VERCEL_TOKEN" 2>/dev/null)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        if: steps.creds.outputs.ok == 'true'
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          # The suite logs in as a named user of a Pro workspace (tests/api.js).
          # The email is a secret, not a variable: Actions logs of a public
          # repository are public, and secrets are masked in them.
          ARTIST_EMAIL: ${{ secrets.ARTIST_EMAIL }}
          ARTIST_PASSWORD: ${{ secrets.ARTIST_PASSWORD }}
          ARTIST_SLUG: ${{ vars.ARTIST_SLUG }}
        run: cd tests && node api.js
