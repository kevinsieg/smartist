name: Reset demo band

# The public demo is a band inside the production database that anyone can
# edit. This puts it back to scripts/demo_seed.json every night.
#
# A GitHub Action rather than a Vercel cron: it keeps the production connection
# string out of the app and needs no extra route.
#
# Needs one repository secret: DEMO_DATABASE_URL — the production connection string.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:       # and on demand from the Actions tab

permissions:
  contents: read

jobs:
  reset:
    name: Restore the demo band from the snapshot
    runs-on: ubuntu-latest
    # Without the secret the script would fall back to whatever DATABASE_URL is
    # in the environment — skip instead of touching the wrong database.
    # Upstream only; on a fork, change this to your own owner/name.
    if: ${{ github.repository == 'kevinsieg/smartist' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # No install scripts: the next step holds a production connection string.
      - run: npm ci --ignore-scripts
      - name: Reset
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          DEMO_ARTIST_SLUG: demo
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DEMO_DATABASE_URL is not set — nothing to do."
            exit 0
          fi
          node scripts/demo_reset.js --yes
