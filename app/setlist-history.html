<!DOCTYPE html>
<html lang="en">
<head>
    <title>History</title>
    <meta charset="utf-8"/>
    <meta name="description" content="Setlist history"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow"/>
    <meta name="theme-color" content="#f9bf8f">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">
    <link rel="stylesheet" href="/app/css/app.css?v=38">
    <script src="/app/js/i18n.js?v=23"></script>
</head>
<body>

<main>
    <section class="app-page">
        <div class="app-wrap">
            <h1 data-i18n="slh.pageTitle">History</h1>

            <div class="history-subnav">
              <span class="subnav-label" style="font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--third-color);" data-i18n="slh.gigTimeline">Gig timeline</span>
            </div>

            <div class="history-filterbar">
              <input class="history-filter-input" type="text" id="filter-name" placeholder="Name…" data-i18n-attr="placeholder:slh.filterNamePlaceholder" oninput="onFilterInput()">
              <input class="history-filter-input" type="text" id="filter-song" placeholder="Song…" data-i18n-attr="placeholder:slh.filterSongPlaceholder" oninput="onSongInput(this.value)">
              <input class="history-filter-input" type="date" id="filter-date-from" title="From date" data-i18n-attr="title:slh.filterFromDate" oninput="onFilterInput()">
              <input class="history-filter-input" type="date" id="filter-date-to" title="To date" data-i18n-attr="title:slh.filterToDate" oninput="onFilterInput()">
              <button class="btn" id="filter-clear-btn" onclick="clearFilters()" style="display:none" data-i18n="slh.clearBtn">Clear</button>
            </div>

            <div id="history-content">
                <p style="text-align:center;color:var(--third-color);" data-i18n="songs.loading">Loading…</p>
            </div>

            <div id="history-footer" style="display:none;text-align:center;margin-top:1.5rem;">
              <p id="history-counter" style="color:var(--third-color);font-size:0.85rem;margin:0 0 0.5rem;"></p>
              <button id="history-load-more-btn" class="btn" onclick="loadMoreHistory()" data-i18n="slh.loadMoreGigs">Load more gigs</button>
            </div>

            <div id="unlinked-section" style="margin-top:2rem;"></div>

            <!-- print-only: header + rendered setlist -->
            <div id="print-header">
                <img alt="" class="app-logo-img">
                <div id="print-meta">
                    <p id="print-setlist-title" style="margin:0;font-family:var(--font-mono);font-size:10pt;"></p>
                    <p id="print-timestamp" style="margin:0;"></p>
                </div>
            </div>
            <div id="print-area"></div>
        </div>
    </section>
</main>

<div class="modal-overlay" id="history-login-modal">
  <div class="modal" style="max-width:320px;">
    <h2 data-i18n="nav.login">Login</h2>
    <div class="modal-field">
      <label for="history-login-pw" data-i18n="setlist.passwordLabel">Password</label>
      <input type="password" id="history-login-pw" placeholder="Band password" data-i18n-attr="placeholder:setlist.passwordPlaceholder" autocomplete="current-password">
    </div>
    <div class="status-msg" id="history-login-status"></div>
    <div class="modal-actions">
      <button class="btn active" onclick="doHistoryLogin()" data-i18n="nav.login">Login</button>
      <button class="btn" onclick="closeHistoryLogin()" data-i18n="songs.cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2 data-i18n="slh.editSetlistTitle">Edit setlist</h2>
    <div class="modal-field" id="edit-auth-field" style="display:none">
      <label for="edit-password" data-i18n="setlist.passwordLabel">Password</label>
      <input type="password" id="edit-password" placeholder="Band password" data-i18n-attr="placeholder:setlist.passwordPlaceholder" autocomplete="current-password">
    </div>
    <div id="edit-form-body">
      <div class="modal-field">
        <label for="edit-title" data-i18n="songs.fieldTitle">Title</label>
        <input type="text" id="edit-title" placeholder="Set name…" data-i18n-attr="placeholder:slh.editTitlePlaceholder">
      </div>
      <div class="modal-field">
        <label for="edit-comment" data-i18n="songs.fieldComment">Comment</label>
        <input type="text" id="edit-comment" placeholder="Notes…" data-i18n-attr="placeholder:slh.editCommentPlaceholder">
      </div>
      <div class="modal-field">
        <label for="edit-gig" data-i18n="slh.gigLabel">Gig</label>
        <select id="edit-gig" onchange="onGigSelect()">
          <option value="" data-i18n="setlist.noGig">— no gig —</option>
        </select>
        <div id="gig-edit-section" style="display:none;margin-top:0.5rem;">
          <button type="button" class="btn new-gig-toggle" id="gig-edit-toggle" onclick="toggleGigEditForm()" data-i18n="slh.editGigDetails">Edit gig details</button>
          <div id="gig-edit-form" class="new-gig-form">
            <div class="modal-field">
              <label for="gig-edit-name" data-i18n="slh.gigNameLabel">Name</label>
              <input type="text" id="gig-edit-name" placeholder="Gig name" data-i18n-attr="placeholder:slh.gigNamePlaceholder">
            </div>
            <div class="modal-field">
              <label for="gig-edit-date" data-i18n="slh.gigDateLabel">Date</label>
              <input type="date" id="gig-edit-date">
            </div>
            <div class="modal-field">
              <label for="gig-edit-venue" data-i18n="slh.gigVenueLabel">Venue</label>
              <select id="gig-edit-venue">
                <option value="" data-i18n="slh.noVenue">— no venue —</option>
              </select>
            </div>
            <div class="modal-field">
              <label for="gig-edit-comment" data-i18n="songs.fieldComment">Comment</label>
              <textarea id="gig-edit-comment" placeholder="Comment…" data-i18n-attr="placeholder:slh.commentPlaceholder"></textarea>
            </div>
            <div class="status-msg" id="gig-edit-status"></div>
            <div class="modal-actions">
              <button class="btn active" id="gig-edit-save-btn" onclick="saveGigEdit()" data-i18n="slh.saveGigBtn">Save gig</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-field">
        <label data-i18n="nav.songs">Songs</label>
        <ul class="edit-song-list" id="edit-song-list"></ul>
        <select id="edit-add-song" onchange="editAddSong(this)" style="margin-top:0.4rem;width:100%;font-family:var(--font-mono);font-size:0.82rem;padding:0.3rem 0.5rem;border:1px dashed rgba(160,156,147,0.4);border-radius:4px;background:transparent;color:var(--third-color);cursor:pointer;">
          <option value="" data-i18n="setlist.addSongPlaceholder">+ add a song…</option>
        </select>
      </div>
    </div>
    <div class="status-msg" id="edit-status"></div>
    <div class="modal-actions">
      <button class="btn active" id="edit-save-btn" onclick="doEditSave()" data-i18n="songs.save">Save</button>
      <button class="btn" onclick="closeEditModal()" data-i18n="songs.cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="share-modal">
  <div class="modal">
    <h2 data-i18n="slh.shareSetlistTitle">Share setlist</h2>
    <form onsubmit="doShareSend(); return false;" autocomplete="on">
      <div class="modal-field" id="share-auth-field" style="display:none">
        <label for="share-password" data-i18n="setlist.passwordLabel">Password</label>
        <input type="password" id="share-password" placeholder="Band password" data-i18n-attr="placeholder:setlist.passwordPlaceholder" autocomplete="current-password">
      </div>
      <div class="modal-field">
        <label for="share-email" data-i18n="slh.recipientEmail">Recipient email</label>
        <input type="email" id="share-email" name="email" placeholder="someone@example.com" data-i18n-attr="placeholder:slh.emailPlaceholder" autocomplete="email">
      </div>
      <div class="status-msg" id="share-status"></div>
      <div class="modal-actions">
        <button type="submit" class="btn active" id="share-send-btn" data-i18n="setlist.shareSendBtn">Send PDF</button>
        <button type="button" class="btn" onclick="closeShareModal()" data-i18n="songs.cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="gig-modal">
  <div class="modal" style="max-width:360px;">
    <h2 data-i18n="slh.editGigTitle">Edit gig</h2>
    <div class="modal-field" id="gig-modal-auth-field" style="display:none">
      <label for="gig-modal-pw" data-i18n="setlist.passwordLabel">Password</label>
      <input type="password" id="gig-modal-pw" placeholder="Band password" data-i18n-attr="placeholder:setlist.passwordPlaceholder" autocomplete="current-password">
    </div>
    <div class="modal-field">
      <label for="gig-modal-name" data-i18n="slh.gigNameLabel">Name</label>
      <input type="text" id="gig-modal-name" placeholder="Gig name" data-i18n-attr="placeholder:slh.gigNamePlaceholder">
    </div>
    <div class="modal-field">
      <label for="gig-modal-date" data-i18n="slh.gigDateLabel">Date</label>
      <input type="date" id="gig-modal-date">
    </div>
    <div class="modal-field">
      <label for="gig-modal-venue" data-i18n="slh.gigVenueLabel">Venue</label>
      <select id="gig-modal-venue">
        <option value="" data-i18n="slh.noVenue">— no venue —</option>
      </select>
    </div>
    <div class="modal-field">
      <label for="gig-modal-comment" data-i18n="songs.fieldComment">Comment</label>
      <textarea id="gig-modal-comment" placeholder="Comment…" data-i18n-attr="placeholder:slh.commentPlaceholder"></textarea>
    </div>
    <div class="status-msg" id="gig-modal-status"></div>
    <div class="modal-actions">
      <button class="btn active" id="gig-modal-save-btn" onclick="doSaveGigModal()" data-i18n="songs.save">Save</button>
      <button class="btn" onclick="closeGigModal()" data-i18n="songs.cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="/app/js/common.js?v=15"></script>
<script src="/app/js/setlist-history.js?v=2"></script>
</body>
</html>
