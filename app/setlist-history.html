<!DOCTYPE html>
<html lang="fr">
<head>
    <title>History</title>
    <meta charset="utf-8"/>
    <meta name="description" content="Setlist history"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow"/>
    <meta name="theme-color" content="#f9bf8f">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">
    <link rel="stylesheet" href="/app/css/app.css?v=4">
</head>
<body>

<main>
    <section class="app-page">
        <div class="app-wrap">
            <h1>History</h1>

            <div class="history-subnav">
              <span class="subnav-label" style="font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--third-color);">Gig timeline</span>
            </div>

            <div class="history-filterbar">
              <input class="history-filter-input" type="text" id="filter-name" placeholder="Name…" oninput="onFilterInput()">
              <input class="history-filter-input" type="text" id="filter-song" placeholder="Song…" oninput="onSongInput(this.value)">
              <input class="history-filter-input" type="date" id="filter-date-from" title="From date" oninput="onFilterInput()">
              <input class="history-filter-input" type="date" id="filter-date-to" title="To date" oninput="onFilterInput()">
              <button class="btn" id="filter-clear-btn" onclick="clearFilters()" style="display:none">Clear</button>
            </div>

            <div id="history-content">
                <p style="text-align:center;color:var(--third-color);">Loading…</p>
            </div>

            <div id="history-footer" style="display:none;text-align:center;margin-top:1.5rem;">
              <p id="history-counter" style="color:var(--third-color);font-size:0.85rem;margin:0 0 0.5rem;"></p>
              <button id="history-load-more-btn" class="btn" onclick="loadMoreHistory()">Load more gigs</button>
            </div>

            <div id="unlinked-section" style="margin-top:2rem;"></div>

            <!-- print-only: header + rendered setlist -->
            <div id="print-header">
                <img alt="" class="app-logo-img">
                <div id="print-meta">
                    <p id="print-setlist-title" style="margin:0;font-family:'Courier New',monospace;font-size:10pt;"></p>
                    <p id="print-timestamp" style="margin:0;"></p>
                </div>
            </div>
            <div id="print-area"></div>
        </div>
    </section>
</main>

<div class="modal-overlay" id="history-login-modal">
  <div class="modal" style="max-width:320px;">
    <h2>Login</h2>
    <div class="modal-field">
      <label for="history-login-pw">Password</label>
      <input type="password" id="history-login-pw" placeholder="Band password" autocomplete="current-password">
    </div>
    <div class="status-msg" id="history-login-status"></div>
    <div class="modal-actions">
      <button class="btn active" onclick="doHistoryLogin()">Login</button>
      <button class="btn" onclick="closeHistoryLogin()">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2>Edit setlist</h2>
    <div class="modal-field" id="edit-auth-field" style="display:none">
      <label for="edit-password">Password</label>
      <input type="password" id="edit-password" placeholder="Band password" autocomplete="current-password">
    </div>
    <div id="edit-form-body">
      <div class="modal-field">
        <label for="edit-title">Title</label>
        <input type="text" id="edit-title" placeholder="Set name…">
      </div>
      <div class="modal-field">
        <label for="edit-comment">Comment</label>
        <input type="text" id="edit-comment" placeholder="Notes…">
      </div>
      <div class="modal-field">
        <label for="edit-gig">Gig</label>
        <select id="edit-gig" onchange="onGigSelect()">
          <option value="">— no gig —</option>
        </select>
        <div id="gig-edit-section" style="display:none;margin-top:0.5rem;">
          <button type="button" class="btn new-gig-toggle" id="gig-edit-toggle" onclick="toggleGigEditForm()">Edit gig details</button>
          <div id="gig-edit-form" class="new-gig-form">
            <div class="modal-field">
              <label for="gig-edit-name">Name</label>
              <input type="text" id="gig-edit-name" placeholder="Gig name">
            </div>
            <div class="modal-field">
              <label for="gig-edit-date">Date</label>
              <input type="date" id="gig-edit-date">
            </div>
            <div class="modal-field">
              <label for="gig-edit-venue">Venue</label>
              <select id="gig-edit-venue">
                <option value="">— no venue —</option>
              </select>
            </div>
            <div class="modal-field">
              <label for="gig-edit-comment">Comment</label>
              <textarea id="gig-edit-comment" placeholder="Comment…"></textarea>
            </div>
            <div class="status-msg" id="gig-edit-status"></div>
            <div class="modal-actions">
              <button class="btn active" id="gig-edit-save-btn" onclick="saveGigEdit()">Save gig</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-field">
        <label>Songs</label>
        <ul class="edit-song-list" id="edit-song-list"></ul>
        <select id="edit-add-song" onchange="editAddSong(this)" style="margin-top:0.4rem;width:100%;font-family:'Courier New',monospace;font-size:0.82rem;padding:0.3rem 0.5rem;border:1px dashed rgba(160,156,147,0.4);border-radius:4px;background:transparent;color:var(--third-color);cursor:pointer;">
          <option value="">+ add a song…</option>
        </select>
      </div>
    </div>
    <div class="status-msg" id="edit-status"></div>
    <div class="modal-actions">
      <button class="btn active" id="edit-save-btn" onclick="doEditSave()">Save</button>
      <button class="btn" onclick="closeEditModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="share-modal">
  <div class="modal">
    <h2>Share setlist</h2>
    <form onsubmit="doShareSend(); return false;" autocomplete="on">
      <div class="modal-field" id="share-auth-field" style="display:none">
        <label for="share-password">Password</label>
        <input type="password" id="share-password" placeholder="Band password" autocomplete="current-password">
      </div>
      <div class="modal-field">
        <label for="share-email">Recipient email</label>
        <input type="email" id="share-email" name="email" placeholder="someone@example.com" autocomplete="email">
      </div>
      <div class="status-msg" id="share-status"></div>
      <div class="modal-actions">
        <button type="submit" class="btn active" id="share-send-btn">Send PDF</button>
        <button type="button" class="btn" onclick="closeShareModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="gig-modal">
  <div class="modal" style="max-width:360px;">
    <h2>Edit gig</h2>
    <div class="modal-field" id="gig-modal-auth-field" style="display:none">
      <label for="gig-modal-pw">Password</label>
      <input type="password" id="gig-modal-pw" placeholder="Band password" autocomplete="current-password">
    </div>
    <div class="modal-field">
      <label for="gig-modal-name">Name</label>
      <input type="text" id="gig-modal-name" placeholder="Gig name">
    </div>
    <div class="modal-field">
      <label for="gig-modal-date">Date</label>
      <input type="date" id="gig-modal-date">
    </div>
    <div class="modal-field">
      <label for="gig-modal-venue">Venue</label>
      <select id="gig-modal-venue">
        <option value="">— no venue —</option>
      </select>
    </div>
    <div class="modal-field">
      <label for="gig-modal-comment">Comment</label>
      <textarea id="gig-modal-comment" placeholder="Comment…"></textarea>
    </div>
    <div class="status-msg" id="gig-modal-status"></div>
    <div class="modal-actions">
      <button class="btn active" id="gig-modal-save-btn" onclick="doSaveGigModal()">Save</button>
      <button class="btn" onclick="closeGigModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="/app/js/common.js?v=9"></script>
<script src="/app/js/setlist-history.js"></script>
</body>
</html>
