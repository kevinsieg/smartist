<!DOCTYPE html>
<html lang="en">
<head>
    <title>Band Tools</title>
    <meta charset="utf-8"/>
    <meta name="description" content="Band tools — setlist generator, song catalogue, GEMA"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow"/>
    <meta name="theme-color" content="#f9bf8f">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">
    <link rel="stylesheet" href="/app/css/app.css">
</head>
<body>

<main>
    <section class="app-page">
        <div class="app-wrap home-wrap">

            <div class="home-hero">
                <img class="app-logo-img home-logo" src="" alt="">
                <p class="home-tagline">Setlist generator · Song catalogue · GEMA</p>
            </div>

            <nav class="home-cards">
                <a href="/setlist" class="home-card">
                    <span class="home-card-icon">&#9835;</span>
                    <span class="home-card-title">Setlist</span>
                    <span class="home-card-desc">Generate and save setlists</span>
                </a>
                <a href="/setlist-history" class="home-card">
                    <span class="home-card-icon">&#8635;</span>
                    <span class="home-card-title">History</span>
                    <span class="home-card-desc">Browse past setlists</span>
                </a>
                <a href="/songs" class="home-card">
                    <span class="home-card-icon">&#8801;</span>
                    <span class="home-card-title">Songs</span>
                    <span class="home-card-desc">Manage the song catalogue</span>
                </a>
                <a href="/gema-import" class="home-card">
                    <span class="home-card-icon">G</span>
                    <span class="home-card-title">GEMA</span>
                    <span class="home-card-desc">Import rights data</span>
                </a>
            </nav>

            <div id="home-auth"></div>

        </div>
    </section>
</main>

<script src="/app/js/common.js"></script>
<script src="/app/js/home.js"></script>
</body>
</html>
