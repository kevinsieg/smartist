<!DOCTYPE html>
<html lang="en">
<head>
  <title>Profile</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#f9bf8f">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="/app/css/app.css?v=29">
  <script src="/app/js/i18n.js?v=9"></script>
  <style>
    .profile-wrap { max-width: 460px; margin: 0 auto; padding: 4.5rem 1.25rem 4rem; }
    .profile-section { margin-bottom: 2rem; }
    .profile-section label { display:block; font-size:0.65rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--third-color); margin-bottom:0.4rem; }
    .profile-email { font-size:0.95rem; padding:0.4rem 0; }
    .profile-hint { font-size:0.72rem; color:var(--third-color); margin-top:0.3rem; }
    .profile-section input[type="password"] { width:100%; padding:0.6rem 0.75rem; border:1px solid #ddd; border-radius:4px; font-size:0.95rem; font-family:inherit; color:var(--black); background:var(--white); outline:none; margin-bottom:0.6rem; }
    .profile-section input[type="password"]:focus { border-color:var(--secondary-color); }
    .save-row { display:flex; align-items:center; gap:1rem; margin-top:0.4rem; }
    .save-msg { font-size:0.72rem; color:var(--third-color); min-height:1.2em; }
    .save-msg.ok { color:#4a9a6a; }
    .save-msg.err { color:var(--danger-color); }
  </style>
</head>
<body>
<div class="app-wrap profile-wrap">
  <h1 data-i18n="profile.title">Profile</h1>

  <div class="profile-section">
    <label data-i18n="profile.emailLabel">Email</label>
    <div class="profile-email" id="profile-email">—</div>
    <div class="profile-hint" data-i18n="profile.emailHint">Your login email.</div>
  </div>

  <div class="profile-section" id="email-section" style="display:none;">
    <label data-i18n="profile.changeEmail">Change email</label>
    <input type="password" id="em-current" placeholder="Current password" autocomplete="current-password" data-i18n-attr="placeholder:profile.pwCurrent">
    <input type="email" id="em-new" placeholder="New email address" autocomplete="email" data-i18n-attr="placeholder:profile.emNew">
    <div class="save-row">
      <button class="btn active" id="em-save-btn" data-i18n="profile.sendConfirmation">Send confirmation link</button>
      <span class="save-msg" id="em-msg"></span>
    </div>
    <div class="profile-hint" data-i18n="profile.emailChangeHint">We email a link to the new address. Your login only changes once you confirm it there.</div>
  </div>

  <div class="profile-section">
    <label data-i18n="profile.languageLabel">Language</label>
    <span data-lang-switcher></span>
  </div>

  <div class="profile-section" id="password-section" style="display:none;">
    <label data-i18n="profile.changePassword">Change password</label>
    <input type="password" id="pw-current" placeholder="Current password" autocomplete="current-password" data-i18n-attr="placeholder:profile.pwCurrent">
    <input type="password" id="pw-new" placeholder="New password (min. 8 characters)" autocomplete="new-password" data-i18n-attr="placeholder:profile.pwNew">
    <input type="password" id="pw-confirm" placeholder="Repeat new password" autocomplete="new-password" data-i18n-attr="placeholder:profile.pwConfirm">
    <div class="save-row">
      <button class="btn active" id="pw-save-btn" data-i18n="profile.changePassword">Change password</button>
      <span class="save-msg" id="pw-msg"></span>
    </div>
  </div>

  <div class="profile-hint" id="bootstrap-note" style="display:none;" data-i18n="profile.bootstrapNote">
    You are logged in with the workspace password — personal passwords are managed per account.
  </div>
</div>

<script src="/app/js/common.js?v=14"></script>
<script>
(function () {
  var _slug = '';

  window.onNavAuthEmpty = function() { goToLogin(); };

  initPage(function(cfg) {
    if (requireLogin()) return;
    _slug = cfg.slug;
    document.getElementById('profile-email').textContent =
      sessionStorage.getItem('smartist_admin_email') || '—';

    // Bootstrap (workspace-password) logins have no users row → no personal password.
    var isBootstrap = getAuthRole() === null;
    document.getElementById(isBootstrap ? 'bootstrap-note' : 'password-section').style.display = '';
    if (isBootstrap) return;

    document.getElementById('pw-save-btn').addEventListener('click', changePassword);

    // Reached only past the bootstrap early-return above, so accounts without a
    // users row never see this — matching the server, which rejects them.
    document.getElementById('email-section').style.display = '';
    document.getElementById('em-save-btn').addEventListener('click', requestEmailChange);
  });

  async function changePassword() {
    var cur = document.getElementById('pw-current').value;
    var nw  = document.getElementById('pw-new').value;
    var cf  = document.getElementById('pw-confirm').value;
    var msg = document.getElementById('pw-msg');
    msg.className = 'save-msg';
    if (!cur || !nw || !cf) { msg.textContent = t('profile.fillAll');     msg.className = 'save-msg err'; return; }
    if (nw.length < 8)      { msg.textContent = t('profile.minChars');    msg.className = 'save-msg err'; return; }
    if (nw !== cf)          { msg.textContent = t('profile.pwMismatch');  msg.className = 'save-msg err'; return; }
    var btn = document.getElementById('pw-save-btn');
    btn.disabled = true; msg.textContent = t('profile.saving');
    try {
      var r = await apiFetch('/api/' + _slug + '/auth?action=change-password', 'POST',
        { currentPassword: cur, newPassword: nw });
      var data = await r.json();
      if (!r.ok) { msg.textContent = data.error || t('profile.failed'); msg.className = 'save-msg err'; return; }
      msg.textContent = t('profile.changed'); msg.className = 'save-msg ok';
      document.getElementById('pw-current').value = '';
      document.getElementById('pw-new').value = '';
      document.getElementById('pw-confirm').value = '';
    } catch (e) {
      if (!String(e.message).includes('Session')) { msg.textContent = t('profile.connError'); msg.className = 'save-msg err'; }
    } finally { btn.disabled = false; }
  }

  async function requestEmailChange() {
    var cur = document.getElementById('em-current').value;
    var nw  = document.getElementById('em-new').value.trim();
    var msg = document.getElementById('em-msg');
    msg.className = 'save-msg';
    if (!cur || !nw) { msg.textContent = t('profile.fillAll'); msg.className = 'save-msg err'; return; }
    var btn = document.getElementById('em-save-btn');
    btn.disabled = true; msg.textContent = t('profile.saving');
    try {
      var r = await apiFetch('/api/' + _slug + '/auth?action=request-email-change', 'POST',
        { currentPassword: cur, newEmail: nw });
      var data = await r.json();
      if (!r.ok) { msg.textContent = data.error || t('profile.failed'); msg.className = 'save-msg err'; return; }
      msg.textContent = t('profile.emailLinkSent'); msg.className = 'save-msg ok';
      document.getElementById('em-current').value = '';
      document.getElementById('em-new').value = '';
    } catch (e) {
      if (!String(e.message).includes('Session')) { msg.textContent = t('profile.connError'); msg.className = 'save-msg err'; }
    } finally { btn.disabled = false; }
  }
}());
</script>
</body>
</html>
