<!DOCTYPE html>
<html lang="en">
<head>
    <title>smartist · Setlists</title>
    <meta charset="utf-8"/>
    <meta name="description" content="Setlist generator"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow"/>
    <meta name="theme-color" content="#f9bf8f">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">
    <link rel="stylesheet" href="/app/css/app.css?v=40">
    <script src="/app/js/i18n.js?v=26"></script>
<style>
  .setlist-page-wrap { position: relative; }

  /* History accordion — all screen sizes */
  .hist-item { border-bottom: 1px solid var(--border-color); }
  .hist-item-header { display:flex; align-items:flex-start; justify-content:space-between; padding:0.6rem 0.3rem; cursor:pointer; gap:0.5rem; user-select:none; border-radius:4px; transition:background 60ms; }
  .hist-item-header:hover { background:rgba(176,106,42,0.06); }
  .hist-item-header:hover .hist-item-title { text-decoration:underline; }
  .hist-item-main { flex:1; min-width:0; }
  .hist-item-titlerow { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
  .hist-item-title { font-weight:600; font-size:0.9rem; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-item-badges { display:flex; gap:0.3rem; flex-shrink:0; align-items:center; }
  .hist-badge { font-size:0.68rem; padding:0.12rem 0.5rem; border-radius:10px; white-space:nowrap; font-weight:500; }
  .hist-badge--count { background:var(--secondary-color); color:var(--secondary-ink); }
  .hist-badge--date { background:var(--primary-color); color:var(--third-color); border:1px solid var(--border-color); }
  .hist-meta-links--header { padding:0.25rem 0 0; border-bottom:none; margin-bottom:0; }
  .hist-item-comment { font-size:0.74rem; color:var(--third-color); font-style:italic; margin-top:0.1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-toggle { background:none; border:none; cursor:pointer; color:var(--third-color); padding:0.1rem; flex-shrink:0; font-size:0.65rem; line-height:1; margin-top:0.3rem; transition:color 60ms; }
  .hist-toggle:hover { color:var(--secondary-ink); }
  .hist-body { padding:0.1rem 0 0.75rem; }
  .hist-meta-links { display:flex; flex-wrap:wrap; gap:0.35rem; padding:0.45rem 0.1rem 0.55rem; border-bottom:1px solid var(--border-color); margin-bottom:0.35rem; }
  .hist-meta-link { font-size:0.73rem; color:var(--secondary-ink); background:var(--primary-color); border:1px solid var(--border-color); border-radius:4px; padding:0.15rem 0.5rem; cursor:pointer; transition:background 60ms,border-color 60ms; }
  .hist-meta-link:hover { background:var(--secondary-color); border-color:var(--secondary-color); }
  .hist-song-row { display:flex; align-items:center; gap:0.5rem; padding:0.22rem 0.25rem; font-size:0.84rem; cursor:pointer; border-radius:3px; }
  .hist-song-row:hover { background:var(--secondary-color); color:var(--secondary-ink); }
  .hist-song-row--active { background:var(--secondary-color); color:var(--secondary-ink); font-weight:600; }
  .hist-song-pos { color:var(--third-color); font-size:0.75rem; min-width:1.5rem; text-align:right; flex-shrink:0; }
  .hist-song-name { flex:1; }
  .hist-song-key { font-size:0.72rem; color:var(--third-color); }
  .hist-song-len { font-size:0.72rem; color:var(--third-color); }
  .hist-songs-total { font-size:0.76rem; color:var(--third-color); margin-top:0.5rem; padding-top:0.4rem; border-top:1px solid var(--border-color); }
  .hist-nav-btn { background:none; border:1px solid var(--border-color); border-radius:4px; padding:0.1rem 0.45rem; cursor:pointer; font-size:0.78rem; color:var(--secondary-ink); line-height:1.5; flex-shrink:0; transition:background 60ms,border-color 60ms; }
  .hist-nav-btn:hover { background:var(--secondary-color); border-color:var(--secondary-color); }
  .hist-details-btn { display:none; background:none; border:1px solid var(--border-color); border-radius:4px; padding:0.1rem 0.45rem; cursor:pointer; font-size:0.78rem; color:var(--secondary-ink); line-height:1.5; flex-shrink:0; transition:background 60ms,border-color 60ms; }
  .hist-details-btn:hover { background:var(--secondary-color); border-color:var(--secondary-color); }
  @media (max-width:1024px) { .hist-details-btn { display:block; } }
  .hist-song-edit-btn { background:none; border:none; cursor:pointer; font-size:0.75rem; color:var(--third-color); padding:0 0.2rem; flex-shrink:0; opacity:0.6; }
  .hist-song-edit-btn:hover { opacity:1; color:var(--secondary-ink); }
  .hist-song-row:hover .hist-song-edit-btn { color:var(--secondary-ink); opacity:1; }
  /* Touch: no hover — keep the edit pencil fully visible and easy to tap */
  @media (hover:none) {
    .hist-song-edit-btn { opacity:1; color:var(--secondary-ink); padding:0.3rem 0.5rem; }
  }

  /* Tab bar — id-specific positioning */
  #setlist-tabs {
    top: var(--setlist-tabs-top, 60px);
  }

  @media (min-width: 1025px) {
    #setlist-page-title { margin-top: 1.5rem; }
    #setlist-content.side-panel-open { padding-right: 380px; }
  }
</style>
  <link rel="stylesheet" href="/app/css/footer.css?v=3">
</head>
<body>

<div id="print-header">
    <img alt="" class="app-logo-img">
    <div id="print-meta">
        <p id="print-timestamp"></p>
    </div>
</div>
<div id="print-area"></div>

<main>
    <section class="app-page setlist-page-wrap">
        <div id="setlist-tabs" class="page-tabs" style="display:none">
            <button class="setlist-tab setlist-tab--active" data-tab="generator" onclick="switchTab('generator')" data-i18n="setlist.tabBuild">Build setlist</button>
            <button class="setlist-tab" data-tab="history" onclick="switchTab('history')" data-i18n="setlist.tabSaved">Saved setlists</button>
        </div>
        <div class="app-wrap">
            <h1 id="setlist-page-title" data-i18n="setlist.pageTitle">Build a setlist</h1>
            <div id="setlist-content">
                <p style="text-align:center;color:var(--third-color);" data-i18n="setlist.loading">Loading songs…</p>
            </div>
        </div>
    </section>
</main>

<!-- History tab: desktop side panel -->
<div id="view-side-panel" role="complementary" data-i18n-attr="aria-label:setlist.sidePanelLabel" aria-label="Setlist details">
  <div class="panel-resize-handle"></div>
  <div id="view-side-panel-inner"></div>
</div>

<!-- Accept / save modal -->
<div class="modal-overlay" id="accept-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
        <h2 id="modal-title" data-i18n="setlist.modalTitle">Save Setlist</h2>

        <div id="auth-step">
            <div class="modal-field">
                <label for="password-input" data-i18n="setlist.passwordLabel">Password</label>
                <input type="password" id="password-input" autocomplete="current-password" data-i18n-attr="placeholder:setlist.passwordPlaceholder" placeholder="Band password">
            </div>
            <div class="status-msg" id="auth-error"></div>
            <div class="modal-actions">
                <button class="btn" id="verify-btn" data-i18n="setlist.verifyBtn">Verify</button>
                <button class="btn" onclick="_closeAcceptModal()" data-i18n="setlist.cancelBtn">Cancel</button>
            </div>
        </div>

        <div id="save-step" style="display:none">
            <div class="modal-field">
                <label for="setlist-title" data-i18n="setlist.nameLabel">Name</label>
                <input type="text" id="setlist-title" data-i18n-attr="placeholder:setlist.namePlaceholder" placeholder="e.g. Summer set">
            </div>
            <div class="modal-field">
                <label for="gig-select" data-i18n="setlist.gigLabel">Gig (optional)</label>
                <select id="gig-select">
                    <option value="" data-i18n="setlist.noGig">&mdash; no gig &mdash;</option>
                </select>
                <button class="btn new-gig-toggle" id="new-gig-btn" data-i18n="setlist.newGigBtn">+ New gig</button>
                <div class="new-gig-form" id="new-gig-form">
                    <div class="modal-field">
                        <label for="gig-name" data-i18n="setlist.gigNameLabel">Gig name</label>
                        <input type="text" id="gig-name" data-i18n-attr="placeholder:setlist.gigNamePlaceholder" placeholder="e.g. Festival Etretat">
                    </div>
                    <div class="modal-field">
                        <label for="gig-date" data-i18n="setlist.gigDateLabel">Date</label>
                        <input type="date" id="gig-date">
                    </div>
                    <div class="modal-field">
                        <label for="gig-venue" data-i18n="setlist.gigVenueLabel">Venue (optional)</label>
                        <input type="text" id="gig-venue">
                    </div>
                    <button class="btn" id="create-gig-btn" style="font-size:0.82rem;padding:0.4rem 0.9rem;min-height:36px" data-i18n="setlist.createGigBtn">Create gig</button>
                </div>
            </div>
            <div class="modal-field">
                <label for="setlist-comment" data-i18n="setlist.commentLabel">Comment (optional)</label>
                <textarea id="setlist-comment" data-i18n-attr="placeholder:setlist.commentPlaceholder" placeholder="Notes about this set…"></textarea>
            </div>
            <div class="status-msg" id="save-error"></div>
            <div class="modal-actions">
                <button class="btn active auth-action" id="save-btn" data-i18n="setlist.saveBtn">Save</button>
                <button class="btn" onclick="_closeAcceptModal()" data-i18n="setlist.cancelBtn">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script src="/app/js/footer.js?v=2"></script>
<script src="/app/js/common.js?v=20"></script>
<script src="/app/js/list-view.js?v=2"></script>
<script src="/app/js/setlist.js?v=3"></script>
</body>
</html>
