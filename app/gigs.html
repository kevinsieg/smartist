<!DOCTYPE html>
<html lang="en">
<head>
  <title>Gigs</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#f9bf8f">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="/app/css/app.css?v=36">
  <script src="/app/js/i18n.js?v=19"></script>
  <style>
    .gigs-wrap { max-width: 1000px; margin: 0 auto; padding: 4.5rem 1.25rem 4rem; }
    .gigs-section-title { font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--third-color); margin: 1.75rem 0 0.75rem; }
    .empty-hint { text-align: center; padding: 2rem 1rem; color: var(--third-color); font-size: 0.88rem; }
    .status-msg { font-size: 0.8rem; color: var(--third-color); margin-top: 0.5rem; min-height: 1.2em; }
    .status-msg.error { color: #e55; }

    /* Action row: calendar group left, add-gig right */
    #gig-action-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; margin-bottom: 0.6rem;
    }
    .gig-cal-group {
      display: flex; align-items: stretch;
      border: 1px solid var(--border-color); border-radius: 5px; overflow: hidden;
    }
    .gig-cal-group a,
    .gig-cal-group .gig-cal-copy-btn {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      font-size: 0.75rem; font-family: inherit;
      color: var(--secondary-ink);
      background: none; border: none; cursor: pointer;
      text-decoration: none; white-space: nowrap;
    }
    .gig-cal-group a { border-right: 1px solid var(--border-color); }
    .gig-cal-group a:hover,
    .gig-cal-group .gig-cal-copy-btn:hover { background: rgba(0,0,0,0.04); }

    /* Filter toggle button */
    #gig-filter-toggle {
      display: inline-flex; align-items: center; gap: 0.4rem;
      border: 1px solid var(--border-color); border-radius: 5px;
      background: none; padding: 0.28rem 0.75rem;
      font-size: 0.75rem; font-family: inherit; color: var(--third-color);
      cursor: pointer; margin-bottom: 0.5rem;
    }
    #gig-filter-toggle.has-active { border-color: var(--secondary-ink); color: var(--secondary-ink); }
    #gig-filter-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--secondary-ink); color: var(--primary-color);
      border-radius: 9px; font-size: 0.6rem; font-weight: 700;
      min-width: 16px; height: 16px; padding: 0 4px;
    }

    /* Filter panel (collapsible) */
    #gig-filter-panel { margin-bottom: 0.5rem; }
    #gig-filter-panel .filter-bar { position: static; border-bottom: none; margin-bottom: 0; }
    #gig-filter-panel .filter-bar-fields { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end; }
    #gig-filter-panel .sort-bar { border-top: 1px solid var(--border-color); padding-top: 0.5rem; margin-top: 0.25rem; margin-bottom: 0; }

    /* Year divider in past gigs list */
    .gigs-year-divider {
      font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--third-color); padding: 1.25rem 0 0.4rem;
      border-bottom: 1px solid var(--border-color); margin-bottom: 0.3rem;
    }

    @media (max-width: 639px) {
      #sort-bar .sort-btn:not([data-field="date"]):not([data-field="title"]) { display: none; }
      .gig-filter-desktop { display: none; }
      #gig-action-row { flex-wrap: wrap; }
      .gig-cal-group { flex: 1; }
      .gig-cal-group a,
      .gig-cal-group .gig-cal-copy-btn { flex: 1; justify-content: center; }
      #gig-add-btn { width: 100%; }
      #gig-filter-toggle { width: 100%; }
    }
  </style>
</head>
<body>
<main class="app-wrap gigs-wrap">
  <h1 data-i18n="gigs.pageTitle">Gigs</h1>

  <div id="gig-action-row">
    <div class="gig-cal-group">
      <a id="gig-cal-subscribe" href="#" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span data-i18n="gigs.subscribeCalendar">Subscribe to calendar</span>
      </a>
      <button id="gig-cal-copy" class="gig-cal-copy-btn" data-i18n="gigs.copyLink">Copy link</button>
    </div>
    <button class="btn active auth-action" disabled id="gig-add-btn" onclick="openAddModal()" data-i18n="gigs.addGigBtn">+ Add gig</button>
  </div>

  <button id="gig-filter-toggle" aria-expanded="false" aria-controls="gig-filter-panel">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
    <span data-i18n="gigs.filtersBtn">Filters</span> <span id="gig-filter-arrow">▾</span><span id="gig-filter-badge" style="display:none"></span>
  </button>

  <div id="gig-filter-panel" role="region" data-i18n-attr="aria-label:gigs.filtersBtn" aria-label="Filters" style="display:none">
    <div class="filter-bar" id="gigs-filter-bar">
      <div class="filter-bar-fields">
        <label class="filter-bar-field">
          <span class="filter-bar-label" data-i18n="gigs.filterGig">Gig</span>
          <input type="text" id="gig-f-gig" class="filter-bar-input" placeholder="Search…" autocomplete="off" data-i18n-attr="placeholder:gigs.filterSearch">
        </label>
        <label class="filter-bar-field gig-filter-desktop">
          <span class="filter-bar-label" data-i18n="gigs.filterVenue">Venue</span>
          <input type="text" id="gig-f-venue" class="filter-bar-input" placeholder="Search…" autocomplete="off" data-i18n-attr="placeholder:gigs.filterSearch">
        </label>
        <label class="filter-bar-field auth-only">
          <span class="filter-bar-label" data-i18n="gigs.filterSetlist">Setlist</span>
          <input type="text" id="gig-f-setlist" class="filter-bar-input" placeholder="Search…" autocomplete="off" data-i18n-attr="placeholder:gigs.filterSearch">
        </label>
        <label class="filter-bar-field">
          <span class="filter-bar-label" data-i18n="gigs.filterSong">Song</span>
          <input type="text" id="gig-f-song" class="filter-bar-input" placeholder="Search…" autocomplete="off" data-i18n-attr="placeholder:gigs.filterSearch">
        </label>
        <span class="filter-count" id="gig-filter-count"></span>
      </div>
      <div id="sort-bar" class="sort-bar"></div>
    </div>
  </div>

  <div class="gigs-section-title" data-i18n="gigs.sectionUpcoming">Upcoming</div>
  <div id="upcoming-list"><p class="empty-hint" data-i18n="gigs.loading">Loading…</p></div>
  <div class="gigs-section-title" data-i18n="gigs.sectionPast">Past</div>
  <div id="past-list"><p class="empty-hint" data-i18n="gigs.loading">Loading…</p></div>
  <div id="gigs-footer" style="display:none;text-align:center;margin-top:1.5rem;">
    <p id="gigs-counter" style="color:var(--third-color);font-size:0.85rem;margin:0 0 0.5rem;"></p>
    <button id="gigs-load-more-btn" class="btn auth-action" disabled onclick="loadMoreGigs()" data-i18n="gigs.loadMore">Load more</button>
  </div>
</main>

<!-- Add/Edit gig modal -->
<div class="modal-overlay" id="gig-modal">
  <div class="modal" style="max-width:460px;">
    <h2 id="gig-modal-title" data-i18n="gigs.addGig">Add gig</h2>
    <div class="modal-field">
      <label data-i18n="gigs.fieldTitle">Title *</label>
      <input type="text" id="gm-title" placeholder="Gig title" data-i18n-attr="placeholder:gigs.fieldTitlePlaceholder">
    </div>
    <div class="modal-field">
      <label data-i18n="gigs.fieldDate">Date</label>
      <input type="date" id="gm-date">
    </div>
    <div class="modal-field">
      <label data-i18n="gigs.fieldType">Type</label>
      <select id="gm-type">
        <option value="">—</option>
        <option value="concert" data-i18n="gigs.typeConcert">Concert</option>
        <option value="festival" data-i18n="gigs.typeFestival">Festival</option>
        <option value="wedding" data-i18n="gigs.typeWedding">Wedding</option>
        <option value="private" data-i18n="gigs.typePrivate">Private</option>
        <option value="other" data-i18n="gigs.typeOther">Other</option>
      </select>
    </div>
    <div class="modal-field">
      <label data-i18n="gigs.fieldVenue">Venue</label>
      <div class="typeahead-wrap">
        <input type="text" id="gm-venue-input" placeholder="Search venue…" autocomplete="off" data-i18n-attr="placeholder:gigs.searchVenuePlaceholder">
        <input type="hidden" id="gm-venue-id">
      </div>
      <div class="quick-create-form" id="gm-venue-qc">
        <div class="qc-row">
          <input type="text" id="gm-venue-qc-name" placeholder="Venue name *" data-i18n-attr="placeholder:gigs.venueNamePlaceholder">
          <input type="text" id="gm-venue-qc-city" placeholder="City" data-i18n-attr="placeholder:gigs.cityPlaceholder">
        </div>
        <div class="qc-actions">
          <button class="btn active" type="button" onclick="quickCreateVenue()" data-i18n="gigs.addVenueBtn">Add venue</button>
          <button class="btn" type="button" onclick="closeVenueQc()" data-i18n="gigs.cancelBtn">Cancel</button>
        </div>
        <div class="status-msg" id="gm-venue-qc-status"></div>
      </div>
    </div>
    <div class="modal-field">
      <label><span data-i18n="gigs.fieldLocation">Location</span> <span style="font-weight:normal;color:var(--third-color);font-size:0.8rem;" data-i18n="gigs.locationHint">(city / address — when no venue)</span></label>
      <input type="text" id="gm-location" placeholder="Paris" data-i18n-attr="placeholder:gigs.locationPlaceholder">
    </div>
    <div class="modal-field">
      <label data-i18n="gigs.fieldOrganizer">Organizer</label>
      <div class="typeahead-wrap">
        <input type="text" id="gm-organizer-input" placeholder="Search organizer…" autocomplete="off" data-i18n-attr="placeholder:gigs.searchOrganizerPlaceholder">
        <input type="hidden" id="gm-organizer-id">
      </div>
      <div class="quick-create-form" id="gm-organizer-qc">
        <div class="qc-row">
          <input type="text" id="gm-organizer-qc-name" placeholder="Organizer name *" data-i18n-attr="placeholder:gigs.organizerNamePlaceholder">
          <input type="text" id="gm-organizer-qc-city" placeholder="City" data-i18n-attr="placeholder:gigs.cityPlaceholder">
        </div>
        <div class="qc-actions">
          <button class="btn active" type="button" onclick="quickCreateOrganizer()" data-i18n="gigs.addOrganizerBtn">Add organizer</button>
          <button class="btn" type="button" onclick="closeOrganizerQc()" data-i18n="gigs.cancelBtn">Cancel</button>
        </div>
        <div class="status-msg" id="gm-organizer-qc-status"></div>
      </div>
    </div>
    <div class="modal-field">
      <label data-i18n="gigs.fieldTimeStart">Start time</label>
      <input type="time" id="gm-time-start">
    </div>
    <div class="modal-field">
      <label data-i18n="gigs.fieldTimeEnd">End time</label>
      <input type="time" id="gm-time-end">
    </div>
    <div class="modal-field">
      <label data-i18n="gigs.fieldLink">Link</label>
      <input type="url" id="gm-link" placeholder="https://…">
    </div>
    <div class="modal-field">
      <label data-i18n="gigs.fieldComment">Comment</label>
      <textarea id="gm-comment" rows="2" placeholder="Notes…" data-i18n-attr="placeholder:gigs.commentPlaceholder"></textarea>
    </div>
    <input type="file" id="gm-poster-input" accept="image/jpeg,image/png,image/webp"
           style="display:none" onchange="handlePosterSelect(this.files[0])">
    <div id="gm-poster-section" style="display:none">
      <hr style="border:none;border-top:1px solid var(--border-color);margin:0.9rem 0 0.75rem">
      <label style="display:block;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--third-color);margin-bottom:0.5rem;" data-i18n="gigs.posterLabel">Poster / Flyer</label>
      <div id="gm-poster-row"></div>
      <div class="status-msg" id="gm-poster-status"></div>
    </div>
    <div class="related-section" id="gm-related" style="display:none;">
      <h4 data-i18n="gigs.relatedTitle">Related</h4>
      <div id="gm-related-content"></div>
    </div>
    <div class="status-msg" id="gm-status"></div>
    <div class="modal-actions">
      <button class="btn active" type="button" onclick="saveGig()" data-i18n="gigs.saveBtn">Save</button>
      <button class="btn" type="button" onclick="closeGigModal()" data-i18n="gigs.cancelBtn">Cancel</button>
      <button class="btn" type="button" id="gm-soft-delete-btn" style="margin-left:auto;color:#e55;" onclick="deleteGigFromPopup()" data-i18n="gigs.deleteBtn">Delete</button>
    </div>
  </div>
</div>

<!-- Setlist detail modal -->
<div class="modal-overlay" id="setlist-detail-modal">
  <div class="modal" style="max-width:360px;">
    <h2 id="sd-title" data-i18n="gigs.setlistModalTitle">Setlist</h2>
    <div id="sd-body" style="margin:0.75rem 0 0.5rem;"></div>
    <div class="modal-actions">
      <button class="btn" type="button" onclick="closeModal('setlist-detail-modal')" data-i18n="gigs.closeBtn">Close</button>
    </div>
  </div>
</div>

<script src="/app/js/common.js?v=14"></script>
<script src="/app/js/gigs.js?v=7"></script>
</body>
</html>
