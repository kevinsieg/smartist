<!DOCTYPE html>
<html lang="en">
<head>
  <title>Gigs</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#f9bf8f">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="/app/css/app.css?v=25">
  <style>
    .gigs-wrap { max-width: 1000px; margin: 0 auto; padding: 4.5rem 1.25rem 4rem; }
    .toolbar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
    .gigs-section-title { font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--third-color); margin: 1.75rem 0 0.75rem; }
    .empty-hint { text-align: center; padding: 2rem 1rem; color: var(--third-color); font-size: 0.88rem; }
    .status-msg { font-size: 0.8rem; color: var(--third-color); margin-top: 0.5rem; min-height: 1.2em; }
    .status-msg.error { color: #e55; }
    /* Keep add-button on the same line as filters by nesting fields in their own flex container */
    #gigs-filter-bar .filter-bar-row1 { flex-wrap: nowrap; align-items: flex-start; }
    #gigs-filter-bar .filter-bar-fields { display: flex; flex: 1; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end; min-width: 0; }
    #gigs-filter-bar .filter-bar-row1 > .btn { margin-top: 0.9rem; flex-shrink: 0; }
    /* Year divider in past gigs list */
    .gigs-year-divider {
      font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--third-color); padding: 1.25rem 0 0.4rem;
      border-bottom: 1px solid var(--border-color); margin-bottom: 0.3rem;
    }
    @media (max-width: 639px) {
      /* Sort: only date and title */
      #sort-bar .sort-btn:not([data-field="date"]):not([data-field="title"]) { display: none; }
      /* Filter: hide venue */
      .gig-filter-desktop { display: none; }
      /* Add button below filter fields */
      #gigs-filter-bar .filter-bar-row1 { flex-wrap: wrap; }
      #gigs-filter-bar .filter-bar-row1 > .btn { width: 100%; margin-top: 0.5rem; }
    }
  </style>
</head>
<body>
<div class="app-wrap gigs-wrap">
  <h1>Gigs</h1>
  <div class="filter-bar" id="gigs-filter-bar">
    <div class="filter-bar-row1">
      <div class="filter-bar-fields">
        <label class="filter-bar-field">
          <span class="filter-bar-label">Gig</span>
          <input type="text" id="gig-f-gig" class="filter-bar-input" placeholder="Search…" autocomplete="off">
        </label>
        <label class="filter-bar-field gig-filter-desktop">
          <span class="filter-bar-label">Venue</span>
          <input type="text" id="gig-f-venue" class="filter-bar-input" placeholder="Search…" autocomplete="off">
        </label>
        <label class="filter-bar-field auth-only">
          <span class="filter-bar-label">Setlist</span>
          <input type="text" id="gig-f-setlist" class="filter-bar-input" placeholder="Search…" autocomplete="off">
        </label>
        <label class="filter-bar-field">
          <span class="filter-bar-label">Song</span>
          <input type="text" id="gig-f-song" class="filter-bar-input" placeholder="Search…" autocomplete="off">
        </label>
        <span class="filter-count" id="gig-filter-count"></span>
      </div>
      <button class="btn active auth-action" disabled id="gig-add-btn" onclick="openAddModal()">+ Add gig</button>
    </div>
  </div>
  <div id="sort-bar" class="sort-bar"></div>
  <div class="gig-cal-bar" style="display:none">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <a id="gig-cal-subscribe" href="#" style="display:none">Subscribe to calendar</a>
    <span class="gig-cal-sep">·</span>
    <button id="gig-cal-copy" class="gig-cal-copy-btn">copy link</button>
  </div>
  <div class="gigs-section-title">Upcoming</div>
  <div id="upcoming-list"><p class="empty-hint">Loading…</p></div>
  <div class="gigs-section-title">Past</div>
  <div id="past-list"><p class="empty-hint">Loading…</p></div>
  <div id="gigs-footer" style="display:none;text-align:center;margin-top:1.5rem;">
    <p id="gigs-counter" style="color:var(--third-color);font-size:0.85rem;margin:0 0 0.5rem;"></p>
    <button id="gigs-load-more-btn" class="btn auth-action" disabled onclick="loadMoreGigs()">Load more</button>
  </div>
</div>

<!-- Add/Edit gig modal -->
<div class="modal-overlay" id="gig-modal">
  <div class="modal" style="max-width:460px;">
    <h2 id="gig-modal-title">Add gig</h2>
    <div class="modal-field">
      <label>Title *</label>
      <input type="text" id="gm-title" placeholder="Gig title">
    </div>
    <div class="modal-field">
      <label>Date</label>
      <input type="date" id="gm-date">
    </div>
    <div class="modal-field">
      <label>Type</label>
      <select id="gm-type">
        <option value="">—</option>
        <option value="concert">Concert</option>
        <option value="festival">Festival</option>
        <option value="wedding">Wedding</option>
        <option value="private">Private</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Venue</label>
      <div class="typeahead-wrap">
        <input type="text" id="gm-venue-input" placeholder="Search venue…" autocomplete="off">
        <input type="hidden" id="gm-venue-id">
      </div>
      <div class="quick-create-form" id="gm-venue-qc">
        <div class="qc-row">
          <input type="text" id="gm-venue-qc-name" placeholder="Venue name *">
          <input type="text" id="gm-venue-qc-city" placeholder="City">
        </div>
        <div class="qc-actions">
          <button class="btn active" type="button" onclick="quickCreateVenue()">Add venue</button>
          <button class="btn" type="button" onclick="closeVenueQc()">Cancel</button>
        </div>
        <div class="status-msg" id="gm-venue-qc-status"></div>
      </div>
    </div>
    <div class="modal-field">
      <label>Location <span style="font-weight:normal;color:var(--third-color);font-size:0.8rem;">(city / address — when no venue)</span></label>
      <input type="text" id="gm-location" placeholder="Paris">
    </div>
    <div class="modal-field">
      <label>Organizer</label>
      <div class="typeahead-wrap">
        <input type="text" id="gm-organizer-input" placeholder="Search organizer…" autocomplete="off">
        <input type="hidden" id="gm-organizer-id">
      </div>
      <div class="quick-create-form" id="gm-organizer-qc">
        <div class="qc-row">
          <input type="text" id="gm-organizer-qc-name" placeholder="Organizer name *">
          <input type="text" id="gm-organizer-qc-city" placeholder="City">
        </div>
        <div class="qc-actions">
          <button class="btn active" type="button" onclick="quickCreateOrganizer()">Add organizer</button>
          <button class="btn" type="button" onclick="closeOrganizerQc()">Cancel</button>
        </div>
        <div class="status-msg" id="gm-organizer-qc-status"></div>
      </div>
    </div>
    <div class="modal-field">
      <label>Start time</label>
      <input type="time" id="gm-time-start">
    </div>
    <div class="modal-field">
      <label>End time</label>
      <input type="time" id="gm-time-end">
    </div>
    <div class="modal-field">
      <label>Link</label>
      <input type="url" id="gm-link" placeholder="https://…">
    </div>
    <div class="modal-field">
      <label>Comment</label>
      <textarea id="gm-comment" rows="2" placeholder="Notes…"></textarea>
    </div>
    <input type="file" id="gm-poster-input" accept="image/jpeg,image/png,image/webp"
           style="display:none" onchange="handlePosterSelect(this.files[0])">
    <div id="gm-poster-section" style="display:none">
      <hr style="border:none;border-top:1px solid var(--border-color);margin:0.9rem 0 0.75rem">
      <label style="display:block;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--third-color);margin-bottom:0.5rem;">Poster / Flyer</label>
      <div id="gm-poster-row"></div>
      <div class="status-msg" id="gm-poster-status"></div>
    </div>
    <div class="related-section" id="gm-related" style="display:none;">
      <h4>Related</h4>
      <div id="gm-related-content"></div>
    </div>
    <div class="status-msg" id="gm-status"></div>
    <div class="modal-actions">
      <button class="btn active" type="button" onclick="saveGig()">Save</button>
      <button class="btn" type="button" onclick="closeGigModal()">Cancel</button>
      <button class="btn" type="button" id="gm-soft-delete-btn" style="margin-left:auto;color:#e55;" onclick="deleteGigFromPopup()">Delete</button>
    </div>
  </div>
</div>

<!-- Setlist detail modal -->
<div class="modal-overlay" id="setlist-detail-modal">
  <div class="modal" style="max-width:360px;">
    <h2 id="sd-title">Setlist</h2>
    <div id="sd-body" style="margin:0.75rem 0 0.5rem;"></div>
    <div class="modal-actions">
      <button class="btn" type="button" onclick="closeModal('setlist-detail-modal')">Close</button>
    </div>
  </div>
</div>

<script src="/app/js/common.js?v=11"></script>
<script src="/app/js/gigs.js?v=6"></script>
</body>
</html>
