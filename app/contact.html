<!DOCTYPE html>
<html lang="en">
<head>
  <title>Contact</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#f9bf8f">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="/app/css/app.css?v=27">
  <style>
    .contact-wrap { max-width: 560px; margin: 0 auto; padding: 4.5rem 1.25rem 4rem; }
    .contact-hint { font-size: 0.88rem; color: var(--muted-ink); margin-bottom: 1.25rem; }
    .contact-field { margin-bottom: 0.9rem; }
    .contact-field label { display: block; font-size: 0.8rem; color: var(--muted-ink); margin-bottom: 0.25rem; }
    .contact-field input, .contact-field textarea {
      width: 100%; box-sizing: border-box; padding: 0.55rem 0.75rem;
      border: 1px solid var(--border-color); border-radius: 4px;
      font-size: 0.95rem; font-family: inherit; background: var(--bg-color); color: inherit; outline: none;
    }
    .contact-field input:focus, .contact-field textarea:focus { border-color: var(--secondary-color); }
    .contact-field textarea { min-height: 140px; resize: vertical; }
  </style>
</head>
<body>
<main>
<div class="app-wrap contact-wrap">
  <h1>Contact</h1>
  <p class="contact-hint">Found a bug, missing a feature, or have an idea? Write us &mdash; we read everything.</p>
  <div class="contact-field">
    <label for="cf-name">Name</label>
    <input type="text" id="cf-name" autocomplete="name">
  </div>
  <div class="contact-field">
    <label for="cf-email">Email</label>
    <input type="email" id="cf-email" autocomplete="email">
  </div>
  <div class="contact-field">
    <label for="cf-msg">Message</label>
    <textarea id="cf-msg" placeholder="What happened, or what would make smartist better for you?"></textarea>
  </div>
  <div class="status-msg" id="cf-status"></div>
  <button class="btn active" id="cf-send">Send message</button>
</div>
</main>
<script src="/app/js/common.js?v=12"></script>
<script src="/app/js/contact.js"></script>
</body>
</html>
