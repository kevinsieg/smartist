<!DOCTYPE html>
<html lang="en">
<head>
  <title>smartist · Contact</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#f9bf8f">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="/app/css/app.css?v=48">
  <script src="/app/js/i18n.js?v=54"></script>
  <style>
    .contact-wrap { max-width: 560px; margin: 0 auto; padding: 4.5rem 1.25rem 4rem; }
    .contact-hint { font-size: 0.88rem; color: var(--muted-ink); margin-bottom: 1.25rem; }
    .contact-field { margin-bottom: 0.9rem; }
    .contact-field label { display: block; font-size: 0.8rem; color: var(--muted-ink); margin-bottom: 0.25rem; }
    .contact-field input, .contact-field textarea {
      width: 100%; box-sizing: border-box; padding: 0.55rem 0.75rem;
      border: 1px solid var(--field-border); border-radius: 4px;
      font-size: 0.95rem; font-family: inherit; background: var(--bg-color); color: inherit; outline: none;
    }
    .contact-field input:focus, .contact-field textarea:focus { border-color: var(--secondary-color); }
    .contact-field textarea { min-height: 140px; resize: vertical; }
  </style>
  <link rel="stylesheet" href="/app/css/footer.css?v=4">
</head>
<body>
<main>
<div class="app-wrap contact-wrap">
  <h1 data-i18n="contact.heading">Contact</h1>
  <p class="contact-hint" data-i18n="contact.hint">Found a bug, missing a feature, or have an idea? Write us &mdash; we read everything.</p>
  <div class="contact-field">
    <label for="cf-name" data-i18n="contact.nameLabel">Name</label>
    <input type="text" id="cf-name" autocomplete="name" data-i18n-attr="placeholder:contact.namePlaceholder" placeholder="Your name">
  </div>
  <div class="contact-field">
    <label for="cf-email" data-i18n="contact.emailLabel">Email</label>
    <input type="email" id="cf-email" autocomplete="email" data-i18n-attr="placeholder:contact.emailPlaceholder" placeholder="your@email.com">
  </div>
  <div class="contact-field">
    <label for="cf-msg" data-i18n="contact.messageLabel">Message</label>
    <textarea id="cf-msg" data-i18n-attr="placeholder:contact.messagePlaceholder" placeholder="What happened, or what would make smartist better for you?"></textarea>
  </div>
  <div class="status-msg" id="cf-status"></div>
  <button class="btn active" id="cf-send" data-i18n="contact.sendBtn">Send message</button>
  <p class="contact-hint" style="margin-top:1rem"><span data-i18n="legal.contactNotice">We use your name and email only to answer you.</span> <a href="/privacy" data-i18n="legal.privacyLink">Privacy policy</a></p>
</div>
</main>
<script src="/app/js/footer.js?v=3"></script>
<script src="/app/js/core.js?v=11"></script>
<script src="/app/js/session.js?v=10"></script>
<script src="/app/js/ui.js?v=9"></script>
<script src="/app/js/shell.js?v=10"></script>
<script src="/app/js/contact.js?v=3"></script>
</body>
</html>
