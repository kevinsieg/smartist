<!DOCTYPE html>
<html lang="en">
<head>
    <title>smartist · Import songs</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow"/>
    <meta name="theme-color" content="#f9bf8f">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">
    <link rel="stylesheet" href="/app/css/app.css?v=55">
    <script src="/app/js/i18n.js?v=63"></script>
  <link rel="stylesheet" href="/app/css/footer.css?v=5">
    <style>
        .si-page .app-wrap { max-width: 100%; }
        .si-page .si-intro { color: var(--muted-ink); font-size: var(--text-md); margin-bottom: 1rem; max-width: 60rem; }
        .si-steps { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
        .si-guide { margin-bottom: 1.25rem; font-size: var(--text-sm); max-width: 60rem; }
        .si-guide summary { cursor: pointer; color: var(--secondary-ink); }
        .si-guide table { margin-top: 0.5rem; }
        .si-guide td { vertical-align: top; }
        .si-notes p { font-size: var(--text-sm); color: var(--muted-ink); margin: 0.25rem 0; }
        .si-toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.75rem 0; font-size: var(--text-sm); }
        .si-toolbar label { display: inline-flex; gap: 0.35rem; align-items: center; }
        .si-table { width: max-content; min-width: 100%; }
        .si-table td { vertical-align: top; }
        .si-cell { max-width: 14rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .si-cell--edit { max-width: none; white-space: normal; overflow: visible; }
        .si-table .si-input { font: inherit; font-size: var(--text-sm); display: block; min-width: 8rem; width: 100%; padding: 0.2rem 0.35rem;
                    border: 1px solid var(--field-border); border-radius: var(--radius-sm); background: var(--bg-color); }
        .si-table .si-input:focus { border-color: var(--secondary-ink); outline: none; }
        .si-table .si-input--bad { border-color: var(--danger-color); }
        .si-err { color: var(--danger-color); font-size: var(--text-xs); margin-top: 0.15rem; white-space: normal; max-width: 16rem; }
        .si-status { white-space: normal; min-width: 9rem; }
        .si-status .gema-badge { margin: 0 0.25rem 0.25rem 0; }
        .si-force { display: flex; gap: 0.3rem; align-items: center; font-size: var(--text-xs); color: var(--muted-ink); }
        .si-row--skipped td { opacity: 0.5; }
        .si-more { color: var(--muted-ink); font-size: var(--text-xs); }
        .si-empty { color: var(--muted-ink); font-size: var(--text-sm); }
        .si-hint { color: var(--muted-ink); font-size: var(--text-sm); }
    </style>
</head>
<body>

<main>
    <section class="app-page si-page">
        <div class="app-wrap">
            <h1 data-i18n="songImport.title">Import songs</h1>
            <div id="si-area" style="display:none">
                <p class="si-intro" data-i18n="songImport.intro">Download the template, fill in one song per row (only the title is required) and upload the file. You can check and fix every row before anything is saved.</p>

                <div class="si-steps">
                    <button class="btn" type="button" data-onclick="siDownloadTemplate()" data-i18n="songImport.downloadTemplate">Download template</button>
                    <button class="btn" type="button" data-onclick="navigate('/songs')" data-i18n="songImport.backToSongs">Back to songs</button>
                </div>

                <details class="si-guide">
                    <summary data-i18n="songImport.guideTitle">What goes in each column</summary>
                    <table class="gema-table">
                        <tbody id="si-guide-body"></tbody>
                    </table>
                </details>

                <div id="si-upload">
                    <div id="si-drop" class="gema-drop-zone" role="button" tabindex="0" data-onclick="clickById('si-file')" data-ondragover="event.preventDefault()" data-ondrop="siHandleDrop(event)">
                        <input type="file" id="si-file" accept=".csv,text/csv" style="display:none" data-onchange="siHandleFile(this.files[0])">
                        <div id="si-drop-label" class="gema-drop-label" data-i18n="songImport.dropLabel">Drop your CSV file here or click to choose it</div>
                        <div id="si-file-info" class="gema-file-info" style="display:none"></div>
                    </div>
                </div>

                <p id="si-status" class="gema-status" style="display:none"></p>

                <div id="si-preview" style="display:none">
                    <div id="si-summary" class="gema-summary"></div>
                    <div id="si-notes" class="si-notes"></div>
                    <div class="si-toolbar">
                        <label id="si-filter-row"><input type="checkbox" id="si-filter" data-onchange="siToggleFilter(this)"> <span data-i18n="songImport.onlyIssues">Show only rows that need attention</span></label>
                        <button id="si-skip-errors" class="btn" type="button" data-onclick="siSkipAll('error')" data-i18n="songImport.skipErrors">Skip rows with errors</button>
                        <button id="si-skip-dups" class="btn" type="button" data-onclick="siSkipAll('duplicate')" data-i18n="songImport.skipDuplicates">Skip duplicates</button>
                    </div>
                    <div id="si-table-wrap" class="gema-table-wrap"></div>
                    <div class="gema-actions">
                        <button class="btn active auth-action" id="si-import-btn" type="button" data-onclick="siImport(this)" disabled>Import</button>
                        <button class="btn" type="button" data-onclick="siStartOver()" data-i18n="songImport.startOver">Choose another file</button>
                    </div>
                    <p id="si-import-hint" class="si-hint"></p>
                </div>

                <div id="si-result" style="display:none">
                    <p id="si-result-text" class="gema-summary"></p>
                    <div class="gema-actions">
                        <button class="btn active" type="button" data-onclick="navigate('/songs')" data-i18n="songImport.openSongs">Open songs</button>
                        <button class="btn" type="button" data-onclick="siStartOver()" data-i18n="songImport.importAnother">Import another file</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="/app/js/footer.js?v=3"></script>
<script src="/app/js/core.js?v=14"></script>
<script src="/app/js/session.js?v=14"></script>
<script src="/app/js/ui.js?v=13"></script>
<script src="/app/js/shell.js?v=14"></script>
<script src="/app/js/song-import.js?v=4"></script>
</body>
</html>
