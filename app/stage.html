<!DOCTYPE html>
<html lang="en">
<head>
    <title>smartist · Stage</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow"/>
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --s-bg:     #111;
            --s-text:   #f0ede8;
            --s-muted:  #958a7f; /* 5.6:1 on --s-bg */
            --s-accent: #f9bf8f;
        }
        html, body {
            min-height: 100%;
            background: var(--s-bg);
            color: var(--s-text);
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Courier New", monospace;
            -webkit-font-smoothing: antialiased;
        }
        .stage-wrap {
            max-width: 680px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 5rem;
        }
        .stage-band {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--s-accent);
            opacity: 0.7;
            margin-bottom: 0.6rem;
        }
        .stage-title {
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: 300;
            line-height: 1.2;
            margin-bottom: 0.35rem;
        }
        .stage-sub {
            font-size: 0.88rem;
            color: var(--s-muted);
            margin-bottom: 0.25rem;
        }
        .stage-header {
            margin-bottom: 2.5rem;
            padding-bottom: 1.25rem;
            padding-right: 7rem;
            border-bottom: 1px solid rgba(249,191,143,0.18);
            position: relative;
        }
        .stage-list { list-style: none; }
        .stage-song {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .stage-num {
            font-size: 1rem;
            color: var(--s-accent);
            opacity: 0.6;
            min-width: 2.4rem;
            text-align: right;
            flex-shrink: 0;
        }
        .stage-song-title {
            flex: 1;
            font-size: clamp(1.4rem, 4.5vw, 2rem);
            font-weight: 300;
            line-height: 1.2;
        }
        a.stage-song-link {
            color: inherit;
            text-decoration: none;
        }
        a.stage-song-link:hover {
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 4px;
        }
        .stage-key {
            font-size: 0.88rem;
            color: var(--s-accent);
            background: rgba(249,191,143,0.1);
            border: 1px solid rgba(249,191,143,0.22);
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .stage-capo {
            font-size: 0.88rem;
            color: var(--s-muted);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .stage-badges { display: flex; gap: 0.5rem; flex-shrink: 0; }
        .stage-total {
            margin-top: 2rem;
            font-size: 0.82rem;
            color: var(--s-muted);
            text-align: right;
        }
        .stage-message {
            text-align: center;
            color: var(--s-muted);
            padding: 5rem 0;
        }
        .stage-header--nav { padding-right: 17rem; }
        @media (max-width: 600px) {
            .stage-wrap { padding: 1rem 1.25rem 6rem; }
            .stage-song { gap: 0.4rem 0.75rem; flex-wrap: wrap; }
            .stage-song-title { flex: 1 1 calc(100% - 3.25rem); }
            /* Badges go under the title so a long title keeps the width. */
            .stage-badges { flex-basis: 100%; padding-left: 3.15rem; }
        }
        /* Notch and home indicator (viewport-fit=cover) */
        @supports (padding: max(0px)) {
            .stage-wrap {
                padding-left:  max(1.25rem, env(safe-area-inset-left));
                padding-right: max(1.25rem, env(safe-area-inset-right));
            }
        }
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
        :focus-visible { outline: 2px solid var(--s-accent); outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) {
            .stage-share-menu { animation: none; }
        }
        @page { margin: 1.5cm; }
        /* Light mode */
        body.stage-light {
            --s-bg:     #f5f2ee;
            --s-text:   #1c1714;
            --s-muted:  #695e55;
            --s-accent: #8a5820;
        }
        body.stage-light .stage-song { border-bottom-color: rgba(0,0,0,0.08); }
        body.stage-light .stage-header { border-bottom-color: rgba(138,88,32,0.2); }
        body.stage-light .stage-key { background: rgba(138,88,32,0.1); border-color: rgba(138,88,32,0.28); }
        body.stage-light .stage-capo { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.12); }
        body.stage-light .song-stage-section { border-top-color: rgba(138,88,32,0.14); }
        body.stage-light .song-stage-link { border-bottom-color: rgba(138,88,32,0.32); }
        body.stage-light .stage-share-btn,
        body.stage-light .stage-invert-btn { border-color: rgba(28,23,20,0.35); }
        body.stage-light .stage-nav-sep { background: rgba(28,23,20,0.18); }
        body.stage-light .stage-share-menu { background: #e8e2d9; border-color: rgba(0,0,0,0.1); box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
        body.stage-light .stage-share-item { border-bottom-color: rgba(0,0,0,0.07); }
        body.stage-light .stage-share-item:hover { background: rgba(0,0,0,0.05); }
        body.stage-light .stage-modal-overlay { background: rgba(0,0,0,0.45); }
        body.stage-light .stage-modal { background: #e8e2d9; border-color: rgba(0,0,0,0.1); }
        body.stage-light .stage-modal-input { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.14); }
        body.stage-light .stage-modal-action-btn { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.12); }

        .lyrics-size-bar {
            position: fixed;
            bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
            right: calc(1.25rem + env(safe-area-inset-right, 0px));
            display: flex;
            gap: 0.3rem;
            z-index: 50;
            background: var(--s-bg);
            border: 1px solid rgba(240,237,232,0.18);
            border-radius: 4px;
            padding: 0.2rem;
        }
        body.stage-light .lyrics-size-bar {
            background: #e8e2d9;
            border-color: rgba(28,23,20,0.15);
        }
        @media (max-width: 480px) {
            .lyrics-size-bar {
                bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
                right: calc(0.75rem + env(safe-area-inset-right, 0px));
            }
        }

        @media print {
            .stage-header-btns, .stage-share-menu, .stage-modal-overlay, .lyrics-size-bar { display: none !important; }
            html, body { background: #fff !important; color: #111 !important; }
            .stage-wrap { padding: 1rem 1.5rem !important; max-width: none !important; }
            .stage-band { color: #666 !important; opacity: 1 !important; margin-bottom: 0.3rem !important; }
            .stage-title { font-size: 1.3rem !important; color: #111 !important; margin-bottom: 0.2rem !important; }
            .stage-sub { color: #555 !important; margin-bottom: 0.15rem !important; }
            .stage-header {
                border-bottom-color: #bbb !important;
                margin-bottom: 1rem !important;
                padding-bottom: 0.6rem !important;
                padding-right: 0 !important; /* .stage-header-btns hidden */
            }
            .stage-song { padding: 0.35rem 0 !important; border-bottom-color: #e0e0e0 !important; }
            .stage-num { color: #999 !important; opacity: 1 !important; font-size: 0.75rem !important; min-width: 1.8rem !important; }
            .stage-song-title { font-size: 1rem !important; color: #111 !important; }
            .stage-key { color: #222 !important; background: transparent !important; border-color: #888 !important; font-size: 0.72rem !important; padding: 0.1rem 0.35rem !important; }
            .stage-capo { color: #444 !important; background: transparent !important; border-color: #bbb !important; font-size: 0.72rem !important; padding: 0.1rem 0.35rem !important; }
            .stage-total { color: #888 !important; margin-top: 0.5rem !important; font-size: 0.75rem !important; }
        }

        /* Header buttons — sits inside .stage-header (position:relative) */
        .stage-header-btns {
            position: absolute;
            top: 0; right: 0;
            display: flex;
            gap: 0.4rem;
            align-items: flex-start;
        }
        /* Phones: the buttons get their own row above the title, which keeps the full width. */
        @media (max-width: 600px) {
            .stage-header, .stage-header--nav { display: flex; flex-direction: column; padding-right: 0; }
            .stage-header-btns { position: static; order: -1; justify-content: flex-end; flex-wrap: wrap; margin-bottom: 0.75rem; }
        }
        .stage-share-btn,
        .stage-invert-btn {
            background: transparent;
            border: 1.5px solid rgba(240,237,232,0.4);
            color: var(--s-text);
            font-family: inherit;
            font-size: 0.82rem;
            padding: 0.4rem 0.5rem;
            min-width: 44px;
            min-height: 44px;
            border-radius: 2px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.1s, background 0.06s;
            text-decoration: none;
        }
        .stage-share-btn:hover,
        .stage-invert-btn:hover { background: var(--s-text); color: var(--s-bg); border-color: var(--s-text); }
        .stage-chart-btn {
            background: rgba(176,106,42,.18);
            border: 1px solid rgba(176,106,42,.35);
            border-radius: 4px;
            color: #f9bf8f;
            padding: 5px 12px;
            min-height: 44px;
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            font-family: inherit;
        }
        .stage-chart-btn:hover { background: rgba(176,106,42,.3); }
        body.stage-light .stage-chart-btn { color: #8b4400; border-color: rgba(139,68,0,.35); background: rgba(139,68,0,.08); }
        body.stage-light .stage-chart-btn:hover { background: rgba(139,68,0,.18); }
.stage-share-btn[disabled] { opacity: 0.28; cursor: default; pointer-events: none; }
        .stage-nav-sep {
            display: inline-block;
            width: 1px;
            height: 1.4rem;
            background: rgba(240,237,232,0.2);
            align-self: center;
            margin: 0 0.1rem;
        }
        .stage-share-menu {
            position: absolute;
            top: 2.5rem; right: 0;
            background: #1e1e1e;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            min-width: 175px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 101;
            animation: s-menu-in 60ms ease-out;
        }
        @keyframes s-menu-in { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:none; } }
        .stage-share-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-height: 44px;
            padding: 0.65rem 1rem;
            font-size: 0.84rem;
            cursor: pointer;
            color: var(--s-text);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            font-family: inherit;
            background: none;
            width: 100%;
            text-align: left;
        }
        .stage-share-item:last-child { border-bottom: none; }
        .stage-share-item:hover { background: rgba(255,255,255,0.07); }
        .stage-share-icon { font-size: 1rem; flex-shrink: 0; }

        /* Song stage view */
        .song-stage-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        /* Recordings / links sections */
        .song-stage-section {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(249,191,143,0.12);
        }
        .song-stage-rec {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .song-stage-rec-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--s-muted);
        }
        .song-stage-audio {
            width: 100%;
            height: 32px;
            display: block;
        }
        .audio-speed-btns {
            display: flex;
            gap: 0.3rem;
        }
        .audio-speed-btns button {
            font-family: inherit;
            font-size: 0.8rem;
            padding: 0.18rem 0.5rem;
            min-width: 44px;
            min-height: 36px;
            border: 1px solid rgba(240,237,232,0.4);
            border-radius: 3px;
            background: none;
            color: var(--s-muted);
            cursor: pointer;
            line-height: 1.4;
            transition: color 0.1s, border-color 0.1s, background 0.1s;
        }
        .audio-speed-btns button:hover { color: var(--s-text); border-color: rgba(240,237,232,0.5); }
        .audio-speed-btns button.active { color: var(--s-accent); border-color: var(--s-accent); background: rgba(249,191,143,0.1); }
        body.stage-light .audio-speed-btns button { border-color: rgba(28,23,20,0.35); color: #695e55; }
        body.stage-light .audio-speed-btns button:hover { color: #1c1714; border-color: rgba(28,23,20,0.5); }
        body.stage-light .audio-speed-btns button.active { color: #8b4400; border-color: #8b4400; background: rgba(139,68,0,0.08); }
        .song-stage-links {
            flex-direction: row;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .song-stage-link {
            font-size: 0.82rem;
            color: var(--s-accent);
            opacity: 0.8;
            text-decoration: none;
            border-bottom: 1px solid rgba(249,191,143,0.3);
            padding-bottom: 1px;
        }
        .song-stage-link:hover { opacity: 1; }
        .song-stage-lyrics {
            font-size: clamp(1.2rem, 3.5vw, 1.7rem);
            font-weight: 300;
            line-height: 1.75;
            white-space: pre-wrap;
            color: var(--s-text);
        }
        .chord-row { white-space: pre-wrap; word-break: break-word; min-height: 1.75em; }
        .chord-row--chords { line-height: 1.25; margin-top: 0.15rem; }
        .ch-seg { display: inline-block; vertical-align: bottom; white-space: pre-wrap; }
        .ch { display: block; min-height: 1.2em; font-size: 0.85em; font-weight: 700; color: var(--s-accent); }
        .ch-tx { display: block; }
        .chord-label { font-weight: 700; margin-top: 0.6rem; }
        .stage-transpose-val { min-width: 2ch; text-align: center; font-size: 11px; align-self: center; }

        /* Email share modal */
        .stage-modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex; align-items: center; justify-content: center;
            z-index: 200;
        }
        .stage-modal {
            background: #1e1e1e;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 1.5rem;
            width: min(320px, 90vw);
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Courier New", monospace;
            color: var(--s-text);
        }
        .stage-modal-title { font-size: 0.95rem; font-weight: 400; margin-bottom: 1.1rem; }
        .stage-modal-field { margin-bottom: 0.7rem; }
        .stage-modal-field label { display: block; font-size: 0.75rem; color: var(--s-muted); margin-bottom: 0.28rem; text-transform: uppercase; letter-spacing: 0.06em; }
        .stage-modal-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.14);
            color: var(--s-text);
            font-family: inherit;
            font-size: 1rem; /* 16px: iOS does not zoom on focus */
            padding: 0.55rem 0.6rem;
            border-radius: 5px;
        }
        .stage-modal-input:focus { outline: none; border-color: var(--s-accent); }
        .stage-modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
        .stage-modal-action-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            color: var(--s-text);
            font-family: inherit;
            font-size: 0.82rem;
            padding: 0.38rem 0.85rem;
            min-height: 44px;
            border-radius: 5px;
            cursor: pointer;
        }
        .stage-modal-action-btn.primary { background: var(--s-accent); color: #111; border-color: var(--s-accent); font-weight: 600; }
        .stage-modal-action-btn:hover { opacity: 0.85; }
        .stage-modal-status { font-size: 0.78rem; color: var(--s-muted); margin-top: 0.5rem; min-height: 1.1em; }

        /* ── Arrangement popup ───────────────────────────────────────────── */
        .arr-stage-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
        .arr-stage-modal-overlay.open { display: flex; }
        .arr-stage-modal { background: #1a1a1a; border-radius: 6px; width: min(96vw, 960px); max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
        .arr-stage-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 14px; border-bottom: 1px solid #333; flex-shrink: 0; font-size: 0.78rem; letter-spacing: 0.06em; color: #f9bf8f; }
        .arr-stage-body { overflow: auto; flex: 1; padding: 0.25rem 0; }
        .arr-stage-close { background: none; border: none; color: #909090; cursor: pointer; font-size: 1.3rem; line-height: 1; min-width: 44px; min-height: 44px; font-family: inherit; }
        body.stage-light .arr-stage-close { color: #555; }
        body.stage-light .arr-stage-modal { background: #e8e2d9; }
        body.stage-light .arr-stage-modal-header { color: #8b4400; border-bottom-color: rgba(0,0,0,0.12); }

        /* ── Arrangement table (inside popup) ────────────────────────────── */
        .arr-table-wrap { overflow-x: auto; }
        .arr-table { border-collapse: collapse; font-size: 0.82rem; width: 100%; color: #f5f0ea; }
        .arr-th { padding: 4px 8px; text-align: left; font-size: 0.7rem; letter-spacing: 0.07em; color: #909090; border-bottom: 2px solid #2a2a2a; white-space: nowrap; background: #111; position: sticky; top: 0; }
        .arr-th--inst { color: #d08a4a; }
        .arr-th--orphan { color: #888; font-style: italic; }
        .arr-tr { border-bottom: 1px solid #222; }
        .arr-tr--alt { background: rgba(255,255,255,.03); }
        .arr-td { padding: 4px 8px; vertical-align: middle; white-space: nowrap; }
        .arr-td--struct { font-weight: 700; color: #f5f0ea; }
        .arr-td--inst { color: #888; }
        .arr-td--harm { color: #6fa8dc; font-weight: 600; }
        .arr-td--com { color: #909090; font-size: 0.75rem; }
        .arr-lead--person { color: #6fa8dc; font-weight: 600; }
        .arr-lead--inst   { color: #b06a2a; font-weight: 600; }
        body.stage-light .arr-table { color: #111; }
        body.stage-light .arr-th { color: #555; border-bottom-color: #ccc; background: #ddd7ce; }
        body.stage-light .arr-th--inst { color: #8b4400; }
        body.stage-light .arr-tr { border-bottom-color: #ddd; }
        body.stage-light .arr-tr--alt { background: rgba(0,0,0,.03); }
        body.stage-light .arr-td--struct { color: #111; }
        body.stage-light .arr-td--inst { color: #555; }
        body.stage-light .arr-lead--person { color: #1a4a99; }
        body.stage-light .arr-lead--inst   { color: #8b4400; }
        body.stage-light .arr-td--harm { color: #1a4a99; }
        body.stage-light .arr-td--com { color: #5f5f5f; }
        @media print {
            .arr-stage-modal-overlay { display: none !important; }
        }
    </style>
</head>
<body>
    <main class="stage-wrap">
        <div id="stage-content">
            <p class="stage-message" role="status">Loading…</p>
        </div>
    </main>
    <div class="sr-only" id="stage-live" role="status" aria-live="polite"></div>

    <div class="stage-modal-overlay" id="stage-share-modal" style="display:none" data-onclick="stageEmailBackdrop(event, this)">
        <div class="stage-modal" role="dialog" aria-modal="true" aria-labelledby="stage-share-title">
            <h2 class="stage-modal-title" id="stage-share-title">Share via email</h2>
            <div class="stage-modal-field" id="stage-modal-pw-field">
                <a id="stage-share-signin" href="/login">Sign in</a> to send the setlist by email.
            </div>
            <div class="stage-modal-field">
                <label for="stage-share-email">Email</label>
                <input type="email" class="stage-modal-input" id="stage-share-email" placeholder="recipient@example.com" autocomplete="email">
            </div>
            <div class="stage-modal-status" id="stage-share-status" role="status" aria-live="polite"></div>
            <div class="stage-modal-actions">
                <button class="stage-modal-action-btn" data-onclick="stageCloseEmail()">Cancel</button>
                <button class="stage-modal-action-btn primary" id="stage-share-send" data-onclick="stageSendEmail()">Send PDF</button>
            </div>
        </div>
    </div>

    <script src="/app/js/core.js?v=14"></script>
    <script src="/app/js/share-utils.js?v=5"></script>
    <script src="/app/js/arrangement.js?v=8"></script>
    <script src="/app/js/chords.js?v=2"></script>
    <script src="/app/js/stage.js?v=11"></script>
</body>
</html>
