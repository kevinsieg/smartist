<!DOCTYPE html>
<html lang="en">
<head>
  <title>Venues</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#f9bf8f">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/favicon_io/site.webmanifest">
  <script src="/app/js/i18n.js?v=8"></script>
  <link rel="stylesheet" href="/app/css/app.css?v=27">
  <script async src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <style>
    .venues-wrap { max-width: 1000px; margin: 0 auto; padding: 4.5rem 1.25rem 4rem; }
    .toolbar { display: flex; gap: 0.75rem; flex-wrap: nowrap; align-items: flex-start; margin-bottom: 0.75rem; }
    .venue-filter-fields { display: flex; flex: 1; flex-wrap: wrap; gap: 0.5rem; align-items: center; min-width: 0; }
    .venue-filter-fields input[type="text"] { flex: 1 1 180px; min-width: 0; padding: 0.5rem 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; font-family: inherit; outline: none; }
    .venue-filter-fields input[type="text"]:focus { border-color: var(--secondary-color); }
    .filter-select { flex: 1 1 110px; min-width: 80px; padding: 0.5rem 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; font-family: inherit; background: var(--bg-color); color: inherit; cursor: pointer; }
    .filter-select:focus { border-color: var(--secondary-color); outline: none; }
    .toolbar > .btn { flex-shrink: 0; }
    @media (max-width: 639px) {
      /* Auth mode: compact row (name + postcode + actions) */
      body:not(.view-mode) #venues-list .sl-row,
      body:not(.view-mode) #placeholder-list .sl-row { grid-template-columns: 1.5fr 1fr auto !important; }
      body:not(.view-mode) #venues-list .sl-row > div:nth-child(n+3):not(:last-child),
      body:not(.view-mode) #placeholder-list .sl-row > div:nth-child(n+3):not(:last-child) { display: none; }
      /* View mode: single full-width column */
      body.view-mode #venues-list .sl-row { grid-template-columns: 1fr !important; }
      .toolbar { flex-wrap: wrap; }
      .toolbar > .btn { width: 100%; margin-top: 0.5rem; }
    }
    .placeholder-section { margin-bottom: 1.5rem; }
    .placeholder-section h2 { font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--third-color); margin-bottom: 0.75rem; }
    .empty-hint { text-align: center; padding: 3rem 1rem; color: var(--third-color); font-size: 0.88rem; }
    .status-msg { font-size: 0.8rem; color: var(--third-color); margin-top: 0.5rem; min-height: 1.2em; }
    .status-msg.error { color: #e55; }
    #venues-tabs { top: var(--venues-tabs-top, 60px); }
    #map-search-bar {
      display: none;
      position: fixed;
      left: 0; right: 0;
      z-index: 90;
      background: var(--bg-color);
      padding: 0.4rem 0.6rem;
      border-bottom: 1px solid var(--border-color);
    }
    #map-search-bar input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--bg-color);
      color: inherit;
    }
    #map-view {
      display: none;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      /* top set by JS in _showMapContainers */
      z-index: 89;
    }
    #map-sidebar {
      width: 190px;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 1rem 0.75rem;
      border-right: 1px solid var(--border-color);
      font-size: 0.82rem;
    }
    #map-canvas { flex: 1; background: #e8e0d5; }
    .map-filter-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--third-color);
      margin: 0.75rem 0 0.3rem;
    }
    .map-filter-label:first-child { margin-top: 0; }
    .map-filter-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.2rem; cursor: pointer; }
    .map-filter-row input { margin: 0; cursor: pointer; }
    .map-size-btns { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
    .map-size-btn {
      padding: 0.2rem 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      background: var(--bg-color);
      font-size: 0.78rem;
      font-family: inherit;
      cursor: pointer;
      color: var(--secondary-ink);
    }
    .map-size-btn.active {
      background: var(--secondary-color);
      border-color: var(--secondary-color);
      color: #fff;
    }
    .map-legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #map-geocode-btn { width: 100%; margin-top: 0.5rem; font-size: 0.78rem; padding: 0.35rem 0.5rem; }
    #map-unmapped-msg { font-size: 0.75rem; color: var(--third-color); margin-top: 0.4rem; line-height: 1.4; }
    #vm-geocode-preview { margin-top: 0.75rem; }
    #vm-geocode-map { height: 180px; border-radius: 4px; border: 1px solid var(--border-color); }
    .vm-geocode-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
    .vm-geocode-actions .btn { font-size: 0.8rem; padding: 0.3rem 0.7rem; }
  </style>
</head>
<body>
<div id="venues-tabs" class="page-tabs" style="display:none">
  <button class="setlist-tab setlist-tab--active" data-tab="list" onclick="switchVenueTab('list')" data-i18n="venues.tabList">List</button>
  <button class="setlist-tab" data-tab="map" onclick="switchVenueTab('map')" data-i18n="venues.tabMap">Map</button>
</div>
<div id="venues-list-view" class="app-wrap venues-wrap">
  <h1 data-i18n="venues.pageTitle">Venues</h1>
  <div class="toolbar">
    <div class="venue-filter-fields">
      <input type="text" id="filter-input" placeholder="Search name, city, country, postcode…" data-i18n-attr="placeholder:venues.searchPlaceholder">
      <select id="filter-status" class="filter-select venue-filter-desktop">
        <option value="" data-i18n="venues.allStatuses">All statuses</option>
      </select>
      <select id="filter-category" class="filter-select venue-filter-desktop">
        <option value="" data-i18n="venues.allCategories">All categories</option>
      </select>
      <select id="filter-country" class="filter-select venue-filter-desktop">
        <option value="" data-i18n="venues.allCountries">All countries</option>
      </select>
    </div>
    <button class="btn active auth-action" disabled id="venue-add-btn" onclick="openAddModal()" data-i18n="venues.addVenueBtn">+ Add venue</button>
  </div>
  <div id="sort-bar" class="sort-bar"></div>
  <div class="placeholder-section">
    <h2 data-i18n="venues.placeholdersSection">Placeholders</h2>
    <div id="placeholder-list"><p class="empty-hint" data-i18n="venues.loading">Loading…</p></div>
  </div>
  <div id="venues-list"><p class="empty-hint" data-i18n="venues.loading">Loading…</p></div>
  <div id="venues-footer" style="display:none;text-align:center;margin-top:1.5rem;">
    <p id="venues-counter" style="color:var(--third-color);font-size:0.85rem;margin:0 0 0.5rem;"></p>
    <button id="venues-load-more-btn" class="btn auth-action" disabled onclick="loadMoreVenues()" data-i18n="venues.loadMore">Load more</button>
  </div>
</div>

<div id="map-search-bar">
  <input type="text" id="map-search-top" placeholder="Search name, city, postcode…"
    data-i18n-attr="placeholder:venues.mapSearchPlaceholder"
    oninput="window._mapFilterText(this.value)">
</div>
<div id="map-view" style="display:none;">
  <div id="map-sidebar"></div>
  <div id="map-canvas"></div>
</div>

<!-- Add/Edit modal -->
<div class="modal-overlay" id="venue-modal">
  <div class="modal" style="max-width:480px;">
    <h2 id="venue-modal-title" data-i18n="venues.addVenue">Add venue</h2>
    <div class="modal-field">
      <label data-i18n="venues.fieldName">Name *</label>
      <input type="text" id="vm-name" placeholder="Venue name" data-i18n-attr="placeholder:venues.fieldNamePlaceholder" oninput="checkVenueDuplicate()">
      <div id="vm-dup-warning" style="display:none;font-size:0.8rem;color:#c80;margin-top:0.3rem;"></div>
    </div>
    <div class="modal-field" style="display:flex;gap:0.6rem;">
      <div style="flex:0 0 80px;">
        <label data-i18n="venues.fieldStreetNo">No.</label>
        <input type="text" id="vm-street-number" placeholder="63" style="width:100%;">
      </div>
      <div style="flex:1 1 auto;">
        <label data-i18n="venues.fieldStreet">Street</label>
        <input type="text" id="vm-street" placeholder="Rue Grande" style="width:100%;">
      </div>
    </div>
    <div class="modal-field" style="display:flex;gap:0.6rem;">
      <div style="flex:0 0 90px;">
        <label data-i18n="venues.fieldPostcode">Postcode</label>
        <input type="text" id="vm-postcode" placeholder="75001" autocomplete="postal-code" style="width:100%;">
      </div>
      <div style="flex:1 1 auto;">
        <label data-i18n="venues.fieldCity">City</label>
        <input type="text" id="vm-city" placeholder="City" data-i18n-attr="placeholder:venues.fieldCityPlaceholder" autocomplete="address-level2" style="width:100%;">
      </div>
    </div>
    <div class="modal-field">
      <label data-i18n="venues.fieldCountry">Country</label>
      <input type="text" id="vm-country" placeholder="Country" data-i18n-attr="placeholder:venues.fieldCountryPlaceholder" autocomplete="country-name">
    </div>
    <div class="modal-field">
      <label data-i18n="venues.fieldStatus">Status</label>
      <select id="vm-status">
        <option value="">—</option>
      </select>
    </div>
    <div class="modal-field">
      <label data-i18n="venues.fieldCategory">Category</label>
      <select id="vm-category">
        <option value="">—</option>
      </select>
    </div>
    <div class="modal-field">
      <label data-i18n="venues.fieldEmail">Email</label>
      <input type="email" id="vm-email" placeholder="booking@venue.com">
    </div>
    <div class="modal-field">
      <label data-i18n="venues.fieldWebsite">Website</label>
      <input type="url" id="vm-website" placeholder="https://…">
    </div>
    <div id="vm-geocode-preview" style="display:none">
      <div id="vm-geocode-map"></div>
      <div class="vm-geocode-actions">
        <button type="button" class="btn" onclick="reGeocodeVenue()" data-i18n="venues.reGeocodeBtn">Re-geocode</button>
        <button type="button" class="btn" onclick="discardGeocode()" data-i18n="venues.discardGeocodeBtn">Don't use these coordinates</button>
      </div>
    </div>
    <div class="modal-field">
      <label data-i18n="venues.fieldComment">Comment</label>
      <textarea id="vm-comment" placeholder="Notes…" data-i18n-attr="placeholder:venues.commentPlaceholder" rows="2"></textarea>
    </div>
      <div class="related-section" id="vm-gigs-section" style="display:none;">
        <h4 data-i18n="venues.gigsAtVenueTitle">Gigs at this venue</h4>
        <div id="vm-gigs-list"></div>
      </div>
    <div class="status-msg" id="vm-status-msg"></div>
    <div class="modal-actions">
      <button class="btn active" type="button" id="vm-save-btn" onclick="saveVenue()" data-i18n="venues.saveBtn">Save</button>
      <button class="btn" type="button" onclick="closeVenueModal()" data-i18n="venues.cancelBtn">Cancel</button>
      <button class="btn" type="button" id="vm-delete-btn" style="margin-left:auto;color:#e55;" onclick="deleteVenueFromPopup()" data-i18n="venues.deleteBtn">Delete</button>
    </div>
  </div>
</div>

<!-- Venue gigs popup -->
<div class="modal-overlay" id="venue-gigs-modal">
  <div class="modal" style="max-width:400px;">
    <h2 id="vgm-title" data-i18n="venues.gigsAtVenueTitle">Gigs at this venue</h2>
    <div id="vgm-body" style="margin:0.75rem 0 0.5rem;max-height:60vh;overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn" type="button" onclick="closeModal('venue-gigs-modal')" data-i18n="venues.closeBtn">Close</button>
    </div>
  </div>
</div>

<script src="/app/js/common.js?v=12"></script>
<script src="/app/js/geo.js?v=2"></script>
<script src="/app/js/venues.js?v=5"></script>
<script src="/app/js/map.js?v=2"></script>
</body>
</html>
